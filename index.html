let state={cash:100,world:1,unlocked:1,tab:'home',plots:Array.from({length:9},()=>null),seeds:{turnip:8,carrot:3},selected:'turnip',buyQty:1,upgrades:{},mutations:{},stats:{earned:0,harvests:0,planted:0,mutations:0,worlds:1},claimed:false,settings:{compact:false},mining:{cashV2:0,depth:1,grid:[],inventory:{stone:0,iron:0,coal:0,gold:0,diamond:0,emerald:0},dug:0,view:'home'},event:null,eventEnds:0,nextEvent:Date.now()+45000,notice:'Welcome to Sprout Valley! Plant a few turnips and grow your garden.'};

let profiles={};let activeProfile='My Garden';
  function loadProfiles(){try{profiles=JSON.parse(localStorage.getItem(PROFILE_KEY)||'{}')||{};}catch(e){profiles={};}try{activeProfile=localStorage.getItem(ACTIVE_KEY)||'My Garden';}catch(e){activeProfile='My Garden';}if(!profiles[activeProfile])profiles[activeProfile]=JSON.parse(JSON.stringify(state));loadActiveProfile();}
function persistProfiles(){try{localStorage.setItem(PROFILE_KEY,JSON.stringify(profiles));localStorage.setItem(ACTIVE_KEY,activeProfile);}catch(e){toast('Could not save in this browser. Check storage settings.');}}
function saveActiveProfile(){if(!activeProfile)return;try{profiles[activeProfile]=JSON.parse(JSON.stringify(state));persistProfiles();}catch(e){/* Storage may be unavailable in private/restricted browsing. */}}
function loadActiveProfile(){let saved=profiles[activeProfile];if(saved&&typeof saved==='object'){const base=defaultState();state={...base,...saved,stats:{...base.stats,...(saved.stats||{})},settings:{...base.settings,...(saved.settings||{})},mining:{...base.mining,...(saved.mining||{}),inventory:{...base.mining.inventory,...(saved.mining?.inventory||{})},grid:Array.isArray(saved.mining?.grid)?saved.mining.grid:[]},plots:Array.isArray(saved.plots)?saved.plots:base.plots,seeds:saved.seeds||base.seeds,upgrades:saved.upgrades||{},mutations:saved.mutations||{},achievements:saved.achievements||{}};}else{state=defaultState();profiles[activeProfile]=JSON.parse(JSON.stringify(state));}try{localStorage.setItem(ACTIVE_KEY,activeProfile);}catch(e){}if(state.event&&Date.now()>=state.eventEnds){state.event=null;state.nextEvent=Date.now()+45000;}if(!state.nextEvent)state.nextEvent=Date.now()+45000;}
function safeText(s){return String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function createProfile(){const input=$('newProfileName');if(!input)return;const name=input.value.trim().replace(/\s+/g,' ').slice(0,24);if(!name)return notify('Enter a profile name first.');if(Object.keys(profiles).some(n=>n.toLowerCase()===name.toLowerCase()))return notify('That profile name already exists on this browser.');saveActiveProfile();activeProfile=name;state=defaultState();profiles[activeProfile]=JSON.parse(JSON.stringify(state));persistProfiles();render();toast('Garden profile created!');}
function switchProfile(name){if(!profiles[name])return;saveActiveProfile();activeProfile=name;loadActiveProfile();render();toast('Switched garden profile.');}
function deleteProfile(name){if(!profiles[name])return;if(Object.keys(profiles).length<=1)return notify('Keep at least one profile.');if(!confirm('Delete the local garden profile “'+name+'”? This cannot be undone.'))return;delete profiles[name];if(activeProfile===name){activeProfile=Object.keys(profiles)[0];loadActiveProfile();}persistProfiles();render();toast('Profile deleted.');}
function resetCurrentSave(){if(!confirm('Reset all progress in this profile? This cannot be undone.'))return;state=defaultState();profiles[activeProfile]=JSON.parse(JSON.stringify(state));persistProfiles();render();toast('This garden has been reset.');}
function toast(s){let t=$('toast');t.textContent=s;t.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.style.display='none',2300)}function notify(s){state.notice=s;toast(s)}function saveCash(n){state.cash+=n;state.stats.earned+=Math.max(0,n);$('cash').textContent=fmt(state.cash)}function seedCost(c){return Math.max(1,Math.ceil(c.cost*1.2*(1-lvl('supplier')*.025)*(1-lvl('seedling','mutations')*.025)*(state.event?.name==='Lucky Breeze' ? .85 : 1)))}function growTime(c){return Math.max(8,c.time*1.25*(1-lvl('soil')*.035)*(1-lvl('clock')*.04)*(1-lvl('rootnetwork','mutations')*.025)*(state.event?.type==='growth' ? .8 : 1))}function sellValue(c){let m=.68+lvl('premium')*.08+lvl('market')*.05+lvl('bountiful','mutations')*.06+lvl('premiumM','mutations')*.055+lvl('goldtouch','mutations')*.04+lvl('traveler','mutations')*.04;if(c.world===3)m+=lvl('cosmic','mutations')*.07;if(state.event&&['value','all'].includes(state.event.type))m*=state.event.mult;if(state.event?.type==='rare'&&c.world>=2)m*=state.event.mult;if(state.event?.type==='blossom'&&c.world===2)m*=state.event.mult;if(state.event?.type==='crystal'&&c.world===3)m*=state.event.mult;return Math.floor(c.value*m)}
function getEventType(name){if(/Rain|Sunshine|Misty|Breezy|Frosty/.test(name))return 'growth';if(/Petal|Firefly/.test(name))return 'mutation';if(/Lucky/.test(name))return 'seed';if(/Meteor|Moonlight/.test(name))return 'rare';if(/Frosty/.test(name))return 'crystal';if(/Flower Festival/.test(name))return 'blossom';if(/Golden|Rainbow|Bee|Harvest Moon/.test(name))return 'value';return 'all'}
function beginEvent(){const e=events[Math.floor(Math.random()*events.length)];state.event={name:e[0],emoji:e[1],desc:e[2],mult:e[3],type:getEventType(e[0])};state.eventEnds=Date.now()+e[4]*1000;state.nextEvent=state.eventEnds+45000;render();toast(`${e[1]} ${e[0]} has started!`)}function endEvent(){state.event=null;state.nextEvent=Date.now()+45000;render()}
function plant(i){let p=state.plots[i];if(p&&isReady(p)){harvest(i);return}if(p){notify('That plot is still growing.');return}let c=crop(state.selected);if(!c||!state.seeds[c.id]){notify('Choose a seed you have in your inventory.');return}state.seeds[c.id]--;state.plots[i]={crop:c.id,started:Date.now(),ends:Date.now()+growTime(c)*1000,mutated:false};state.stats.planted++;render()}
function harvest(i){let p=state.plots[i];if(!isReady(p))return;let c=crop(p.crop);let amount=sellValue(c);if(Math.random()<lvl('water')*.025)amount=Math.floor(amount*1.2);if(Math.random()<lvl('double','mutations')*.035)amount*=2;let mutChance=.03+lvl('lucky')*.012+lvl('rainbow','mutations')*.015;if(state.event?.type==='mutation')mutChance*=state.event.mult;let mutated=Math.random()<mutChance;if(mutated){amount=Math.floor(amount*1.35);state.stats.mutations++;}saveCash(amount);state.stats.harvests++;if(Math.random()<lvl('super','mutations')*.025)state.seeds[c.id]=(state.seeds[c.id]||0)+1;state.plots[i]=null;checkAchievements();render();toast(`${c.emoji} Harvested ${c.name} for $${fmt(amount)}${mutated?' · Mutation bonus!':''}`)}
function harvestAll(){let n=0;state.plots.forEach((p,i)=>{if(isReady(p)){harvest(i);n++}});if(!n)notify('No crops are ready yet.');else toast('Harvested ready crops!')}
function buy(id,qty=1){let c=crop(id);if(!c||c.world>state.unlocked)return;qty=Math.max(1,Math.min(9999,Math.floor(Number(qty)||1)));let cost=seedCost(c)*qty;if(state.cash<cost){notify(`You need $${fmt(cost)} for that many seeds.`);return}state.cash-=cost;state.seeds[id]=(state.seeds[id]||0)+qty;$('cash').textContent=fmt(state.cash);render();toast(`Bought ${qty} ${c.name} seed${qty===1?'':'s'}!`)}

function accountsHTML(){const names=Object.keys(profiles).sort((a,b)=>a.localeCompare(b));return hero('Accounts & Saves 👤','Create separate garden profiles on this browser. Each profile saves its own Cash, crops, upgrades, mutations, and world progress automatically.')+`<div class="grid">${card('🌱 Create a garden profile',`<p class="muted">Choose a nickname for this browser. Do not use your real full name, email, or password.</p><div class="row"><input id="newProfileName" maxlength="24" placeholder="Garden nickname" autocomplete="off"><button class="btn primary" onclick="createProfile()">Create profile</button></div>`)}${card('💾 Current profile',`<div class="big">${safeText(activeProfile)}</div><p class="muted">Your progress saves automatically in this browser.</p><span class="pill">${fmt(state.cash)} Cash · World ${state.world}</span><div class="divider"></div><button class="btn" onclick="resetCurrentSave()">Reset this profile</button>`)}${card('📂 Switch profiles',names.map(n=>`<div class="row"><span>${safeText(n)} ${n===activeProfile?'<span class="pill">ACTIVE</span>':''}</span><div class="row"><button class="btn ${n===activeProfile?'primary':''}" data-profile="${safeText(n)}" onclick="switchProfile(this.dataset.profile)" ${n===activeProfile?'disabled':''}>${n===activeProfile?'Selected':'Load'}</button>${names.length>1?`<button class="btn" data-profile="${safeText(n)}" onclick="deleteProfile(this.dataset.profile)">Delete</button>`:''}</div></div>`).join('<div class="divider"></div>'))}</div><div class="notice" style="margin-top:16px"><b>Important:</b> These are local profiles, not secure online accounts. They work on this browser and device only. Clearing browser data can erase them. For accounts that sync across devices, Sprout Valley needs a real online authentication/database service.</div>`}

  const mineMaterials=[
 {id:'stone',name:'Stone',emoji:'🪨',price:2,weight:46,desc:'Common rock found throughout the cave.'},
 {id:'iron',name:'Iron',emoji:'⛓️',price:8,weight:27,desc:'Useful metal ore.'},
 {id:'coal',name:'Coal',emoji:'⚫',price:12,weight:17,desc:'A dark, valuable fuel mineral.'},
 {id:'gold',name:'Gold',emoji:'🟨',price:35,weight:7,desc:'A rare shiny find.'},
 {id:'diamond',name:'Diamond',emoji:'💎',price:100,weight:2.2,desc:'A precious gem, more likely deeper down.'},

function ensureMine(){if(!state.mining)state.mining={cashV2:0,depth:1,grid:[],inventory:{stone:0,iron:0,coal:0,gold:0,diamond:0,emerald:0},dug:0,view:'home'};state.mining.inventory=state.mining.inventory||{};mineMaterials.forEach(m=>{if(typeof state.mining.inventory[m.id]!=='number')state.mining.inventory[m.id]=0});if(!Array.isArray(state.mining.grid)||state.mining.grid.length!==70)generateMineGrid();}
function pickOre(){let depth=Math.max(1,state.mining.depth);let list=mineMaterials.map(m=>({...m,weight:m.weight*(m.id==='diamond'?1+depth*.22:m.id==='emerald'?1+depth*.28:m.id==='stone'?Math.max(.25,1-depth*.035):1)}));let total=list.reduce((a,m)=>a+m.weight,0),r=Math.random()*total;for(const m of list){r-=m.weight;if(r<=0)return m.id}return 'stone'}
function generateMineGrid(){ensureMineBase();state.mining.grid=Array.from({length:70},()=>({ore:pickOre(),dug:false}));}
function ensureMineBase(){if(!state.mining)state.mining={cashV2:0,depth:1,grid:[],inventory:{stone:0,iron:0,coal:0,gold:0,diamond:0,emerald:0},dug:0,view:'home'};state.mining.inventory=state.mining.inventory||{stone:0,iron:0,coal:0,gold:0,diamond:0,emerald:0};}
function digTile(i){ensureMine();const tile=state.mining.grid[i];if(!tile||tile.dug)return;tile.dug=true;state.mining.inventory[tile.ore]=(state.mining.inventory[tile.ore]||0)+1;state.mining.dug++;const m=mineMaterials.find(x=>x.id===tile.ore);saveActiveProfile();render();toast(`Found ${m.emoji} ${m.name}!`)}
function descendMine(){ensureMine();const remaining=state.mining.grid.filter(t=>!t.dug).length;if(remaining>0)return notify(`You still have ${remaining} rocks left! Clear this level before descending.`);state.mining.depth++;generateMineGrid();saveActiveProfile();render();toast(`You reached cave level ${state.mining.depth}!`)}
function sellOre(id){ensureMine();const m=mineMaterials.find(x=>x.id===id);if(!m)return;const qty=state.mining.inventory[id]||0;if(!qty)return notify(`You don't have any ${m.name} to sell.`);state.mining.inventory[id]=0;state.mining.cashV2+=qty*m.price;saveActiveProfile();render();toast(`Sold ${qty} ${m.name} for ${fmt(qty*m.price)} Cash V2!`)}
function sellAllOres(){ensureMine();let total=0,count=0;for(const m of mineMaterials){const q=state.mining.inventory[m.id]||0;total+=q*m.price;count+=q;state.mining.inventory[m.id]=0}if(!count)return notify('Your mining inventory is empty.');state.mining.cashV2+=total;saveActiveProfile();render();toast(`Sold ${count} materials for ${fmt(total)} Cash V2!`)}
function enterMining(){ensureMine();state.tab='mining';state.mining.view='home';render();window.scrollTo({top:0,behavior:'smooth'})}
function exitMining(){state.tab='home';render();window.scrollTo({top:0,behavior:'smooth'})}

function versionsHTML(){return hero('Update Log 📋','What changed in each pre-release version.')+`<div class="grid">${card('v2.3.0 — Mining Update <span class="pill">LATEST</span>',`<p class="muted small">October 23, 2026 · Pre-release</p><ul><li>Moved Mining off the main navigation and added a Mining entrance card to the farming Home screen.</li><li>Added a separate mining interface with Mining Home, Cave, Inventory, and Crafting tabs.</li><li>Added a return-to-farming button on Mining Home only; use Mining Home to return from the other mining tabs.</li><li>Expanded each cave level from 49 to 70 rocks (10 rows of 7).</li><li>Required every rock on a level to be dug before descending.</li><li>Added Stone, Iron, Coal, Gold, Diamond, and Emerald with a separate Cash V2 balance and selling system.</li><li>Improved rare material odds as cave depth increases.</li><li>Added a Crafting screen marked Coming Soon.</li><li>Preserved farming crops, worlds, seeds, upgrades, mutations, weather, achievements, daily rewards, profiles, and local saves.</li></ul>`)}${card('v2.2.0 — Local Profiles & Saving',`<p class="muted small">October 23, 2026 · Pre-release</p><ul><li>Added separate garden profiles with nicknames.</li><li>Added automatic local saves after game actions and while playing.</li><li>Added profile switching, profile deletion, and reset-current-profile controls.</li><li>Saves stay in this browser and do not sync across devices.</li><li>No passwords or personal contact details are collected.</li></ul>`)}${card('v2.1.0 — Progression Balance Update',`<p class="muted small">October 23, 2026 · Pre-release</p><ul><li>Reduced crop selling values and tuned the economy for slower cash farming.</li><li>Raised seed prices to make bulk purchases a more meaningful decision.</li><li>Increased crop growing times, especially in later worlds.</li><li>Raised World 2 and World 3 unlock costs.</li><li>Increased upgrade costs to make each level feel like a milestone.</li><li>Kept weather events and mutations useful as temporary boosts.</li><li>Slower progression tuned for a more satisfying journey.</li></ul>`)}${card('v2.0.0 — Worlds & Weather',`<ul><li>Added Cash currency and Worlds 1–3.</li><li>Added World 4 Coming Soon.</li><li>Added 42 crops, bulk seed buying, and seed inventory.</li><li>Added mutations, upgrades, 16 weather events, achievements, and daily rewards.</li></ul>`)}${card('v1.2.0 — Farm Improvements',`<ul><li>Added update log and bulk seed buying.</li><li>Added inventory selection and planting.</li><li>Improved timer updates to reduce interface movement.</li></ul>`)}${card('v1.1.0 — Garden Update',`<ul><li>Expanded seed and crop shop.</li><li>Added upgrades and basic harvest feedback.</li></ul>`)}${card('v1.0.0 — First Sprout',`<ul><li>First playable farm prototype.</li><li>Plant, grow, and harvest crops.</li></ul>`)}</div>`}
function creditsHTML(){return hero('Credits 💚','A little garden built by a small team.')+`<div class="grid">${card('🌱 Jedi Romero','<p>Creator · Game concept and direction</p>')}${card('🧪 John','<p>Playtester · Testing and feedback</p>')}${card('🤖 ChatGPT','<p>Coding Assistant · Prototype code and balancing</p>')}</div>`}
function render(){nav();saveActiveProfile();$('profileBadge').textContent=activeProfile;$('cash').textContent=fmt(state.cash);let html={home:homeHTML,farm:farmHTML,seeds:seedsHTML,mining:miningHTML,market:marketHTML,upgrades:upgradesHTML,mutations:mutationsHTML,worlds:worldsHTML,events:eventsHTML,achievements:achievementsHTML,daily:dailyHTML,settings:settingsHTML,accounts:accountsHTML,versions:versionsHTML,credits:creditsHTML};$('app').innerHTML=(html[state.tab]||homeHTML)();document.body.className=`world-${state.world}`}
function tick(){let now=Date.now();if(state.event&&now>=state.eventEnds){state.event=null;state.nextEvent=now+45000;if(state.tab==='events'||state.tab==='home')render()}else if(!state.event&&now>=state.nextEvent)beginEvent();document.querySelectorAll('.plot').forEach((el,i)=>{let p=state.plots[i];if(!p)return;let bar=el.querySelector('.progress span');if(bar)bar.style.width=Math.min(100,(now-p.started)/(p.ends-p.started)*100)+'%';let status=el.querySelector('.muted.small');if(status)status.textContent=isReady(p)?'Ready to harvest':`${Math.max(0,Math.ceil((p.ends-now)/1000))}s remaining`;let emoji=el.querySelector('.crop');if(emoji)emoji.textContent=isReady(p)?'✨':crop(p.crop).emoji;let btn=el.querySelector('button');if(btn&&btn.textContent.includes('Growing'))btn.textContent=isReady(p)?'Harvest':'Growing…'});let ev=document.querySelector('.event-active');if(ev&&state.event){let p=ev.querySelector('p');if(p)p.textContent=`${state.event.emoji} ${state.event.name} — ${state.event.desc} · ${Math.max(0,Math.ceil((state.eventEnds-now)/1000))}s left`}}
loadProfiles();render();setInterval(tick,500);setInterval(saveActiveProfile,5000);window.addEventListener('pagehide',saveActiveProfile);
</script>
</body>
</html>
