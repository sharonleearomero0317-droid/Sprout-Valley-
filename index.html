padding:9px 0;border-bottom:1px solid var(--line)}.mine-wallet{background:#2d243c;border:1px solid #8873a4;color:#ead8ff;padding:12px 16px;border-radius:12px;font-weight:850}.crafting-locked{border:1px dashed #8873a4;background:#2a2435}.divider{height:1px;background:var(--line);margin:15px 0}.toast{position:fixed;right:16px;bottom:16px;z-index:10;background:#e3f1d9;color:#15231a;padding:12px 17px;border-radius:12px;font-weight:800;box-shadow:0 10px 30px #0006;display:none;max-width:90vw}/* v2.3.1 visual polish: richer depth, clearer focus, and illustrated world panels */
:root{--line:#45664f;--green:#b2efb4;--gold:#ffe09a}

/* v2.4.0 — animated interface update */
:root{--ease-out:cubic-bezier(.16,1,.3,1);--glow-green:#a8f2b2;--glow-gold:#ffe3a1}
html{scroll-behavior:smooth}
body{isolation:isolate;overflow-x:hidden}
body:before,body:after{content:"";position:fixed;pointer-events:none;z-index:-1;border-radius:50%;filter:blur(2px);opacity:.28;animation:ambientDrift 18s ease-in-out infinite alternate}
body:before{width:34vw;height:34vw;min-width:220px;min-height:220px;left:-12vw;top:25vh;background:radial-gradient(circle,#68b97a40,transparent 68%)}
body:after{width:38vw;height:38vw;min-width:240px;min-height:240px;right:-15vw;top:55vh;background:radial-gradient(circle,#a8a0ff25,transparent 68%);animation-delay:-7s}
@keyframes ambientDrift{from{transform:translate3d(0,-12px,0) scale(.96)}to{transform:translate3d(20px,22px,0) scale(1.08)}}
header{position:relative;overflow:hidden}
header:after{content:"";position:absolute;left:-30%;top:0;width:28%;height:100%;background:linear-gradient(90deg,transparent,#ffffff08,transparent);transform:skewX(-20deg);animation:headerShimmer 11s ease-in-out infinite;pointer-events:none}
@keyframes headerShimmer{0%,65%{left:-35%}100%{left:120%}}
.logo{animation:logoFloat 4s ease-in-out infinite;transform-origin:50% 60%}
@keyframes logoFloat{0%,100%{translate:0 0;rotate:-3deg}50%{translate:0 -3px;rotate:2deg}}
.brand h1{background:linear-gradient(90deg,#f4f1df,#b7efbd,#f4f1df);background-size:200% auto;color:transparent;background-clip:text;animation:titleShimmer 9s linear infinite}
@keyframes titleShimmer{to{background-position:200% center}}
nav{scrollbar-width:thin;scrollbar-color:#52785b transparent}
nav button{position:relative;overflow:hidden}
nav button:after,.btn:after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 25%,#ffffff20 48%,transparent 70%);transform:translateX(-130%);transition:transform .5s var(--ease-out);pointer-events:none}
nav button:hover:after,.btn:hover:after{transform:translateX(130%)}
nav button.active{box-shadow:0 0 0 1px #b2efb433,0 0 18px #9ed9a21a}
#app{transform-origin:top center}
#app.screen-enter{animation:screenEnter .42s var(--ease-out) both}
@keyframes screenEnter{from{opacity:0;transform:translateY(11px) scale(.995);filter:blur(2px)}to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}
.hero{animation:heroEnter .55s var(--ease-out) both}
@keyframes heroEnter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.hero:before{content:"";position:absolute;right:-55px;bottom:-110px;width:230px;height:230px;border:1px solid #ffffff10;border-radius:50%;box-shadow:0 0 0 22px #ffffff04,0 0 0 44px #ffffff03;pointer-events:none}
.grid>.card{animation:cardEnter .48s var(--ease-out) both}
.grid>.card:nth-child(2){animation-delay:.045s}.grid>.card:nth-child(3){animation-delay:.09s}.grid>.card:nth-child(4){animation-delay:.135s}.grid>.card:nth-child(5){animation-delay:.18s}.grid>.card:nth-child(6){animation-delay:.225s}.grid>.card:nth-child(n+7){animation-delay:.26s}
@keyframes cardEnter{from{opacity:0;transform:translateY(12px) scale(.99)}to{opacity:1;transform:translateY(0) scale(1)}}
.card{position:relative;overflow:hidden}
.card:focus-within{border-color:#a5dba7}
.btn,nav button,.tabs button,.mine-tile{position:relative;overflow:hidden;transition:transform .18s var(--ease-out),filter .18s ease,box-shadow .18s ease,background .18s ease}
.btn:active,nav button:active,.tabs button:active{transform:scale(.97)}
.btn.primary{box-shadow:0 4px 0 #638a68,0 8px 18px #0002}

@keyframes plotPop{from{opacity:.6;transform:scale(.97)}to{opacity:1;transform:scale(1)}}
.plot .crop{display:inline-block;animation:cropBob 3s ease-in-out infinite;transform-origin:50% 85%}
@keyframes cropBob{0%,100%{translate:0 0}50%{translate:0 -3px}}
.plot:has(button:not(:disabled):hover){border-color:#b4e7a7;box-shadow:0 0 0 1px #b4e7a733,0 12px 26px #0002}
.progress span{position:relative;overflow:hidden}

.section-title{position:relative}
.section-title:after{content:"";display:block;width:46px;height:3px;margin-top:6px;border-radius:99px;background:linear-gradient(90deg,var(--green),transparent)}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}

function toast(s){let t=$('toast');t.textContent=s;t.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.style.display='none',2300)}function notify(s){state.notice=s;toast(s)}function saveCash(n){state.cash+=n;state.stats.earned+=Math.max(0,n);$('cash').textContent=fmt(state.cash)}function seedCost(c){return Math.max(1,Math.ceil(c.cost*1.32*(1-lvl('supplier')*.025)*(1-lvl('seedling','mutations')*.025)*(state.event?.name==='Lucky Breeze' ? .85 : 1)))}function growTime(c){return Math.max(8,c.time*1.42*(1-lvl('soil')*.035)*(1-lvl('clock')*.04)*(1-lvl('rootnetwork','mutations')*.025)*(state.event?.type==='growth' ? .8 : 1)*(state.event&&state.village?.structures?.weatherBeacon?1-(state.village?.upgrades?.weather||0)*.012:1))}function sellValue(c){let m=.62+lvl('premium')*.08+lvl('market')*.05+lvl('bountiful','mutations')*.06+lvl('premiumM','mutations')*.055+lvl('goldtouch','mutations')*.04+lvl('traveler','mutations')*.04;if(c.world===3)m+=lvl('cosmic','mutations')*.07;if(state.event&&['value','all'].includes(state.event.type))m*=state.event.mult;if(state.event&&state.village?.structures?.weatherBeacon)m*=1+(state.village?.upgrades?.weather||0)*.06;if(state.event?.type==='rare'&&c.world>=2)m*=state.event.mult;if(state.event?.type==='blossom'&&c.world===2)m*=state.event.mult;if(state.event?.type==='crystal'&&c.world===3)m*=state.event.mult;return Math.floor(c.value*m)}

function ensureMine(){ensureMineBase();const mine=state.mining;mine.inventory=mine.inventory||{};mineMaterials.forEach(m=>{if(typeof mine.inventory[m.id]!=='number')mine.inventory[m.id]=0});if(!mine.pickaxe)mine.pickaxe='starter';if(!mine.autoMiner)mine.autoMiner={built:false,level:0,nextAt:0,logs:[]};mine.autoMiner.logs=Array.isArray(mine.autoMiner.logs)?mine.autoMiner.logs:[];if(!Array.isArray(mine.grid)||mine.grid.length!==70)generateMineGrid();}
function mineDepthInfo(depth=state.mining.depth){if(depth<3)return {name:'Mossy Stone',desc:'Stone, iron, and coal are most common.'};if(depth<5)return {name:'Copper Veins',desc:'Copper and tin start appearing in the lower stone.'};if(depth<7)return {name:'Crystal Shelf',desc:'Quartz, lapis lazuli, and more precious minerals appear.'};if(depth<10)return {name:'Redstone Caverns',desc:'Redstone veins power advanced crafting recipes.'};if(depth<15)return {name:'Obsidian Rift',desc:'Obsidian is found among the darkest volcanic rock.'};return {name:'Moonstone Abyss',desc:'The rare Moonstone only appears at depth 15 and beyond.'}}
function pickOre(){let depth=Math.max(1,state.mining.depth),luck=state.mining.pickaxe==='crystal'?.16:state.mining.pickaxe==='iron'?.06:0;let list=mineMaterials.filter(m=>!m.minDepth||depth>=m.minDepth).map(m=>{let rare=['gold','silver','amethyst','topaz','ruby','sapphire','diamond','emerald','lapis','redstone','obsidian','moonstone'].includes(m.id);let depthBoost=rare?1+Math.min(30,depth-1)*.11:1;let rareBoost=rare?1+luck*4:1;return {...m,weight:m.weight*depthBoost*rareBoost}});let total=list.reduce((a,m)=>a+m.weight,0),r=Math.random()*total;for(const m of list){r-=m.weight;if(r<=0)return m.id}return 'stone'}
function generateMineGrid(){ensureMineBase();state.mining.grid=Array.from({length:70},()=>({ore:pickOre(),dug:false}));}
function ensureMineBase(){if(!state.mining)state.mining={cashV2:0,depth:1,grid:[],inventory:{},dug:0,view:'home',pickaxe:'starter',autoMiner:{built:false,level:0,nextAt:0,logs:[]}};state.mining.inventory=state.mining.inventory||{};if(!state.mining.autoMiner)state.mining.autoMiner={built:false,level:0,nextAt:0,logs:[]};}
function digTile(i){ensureMine();const mine=state.mining;const tile=mine.grid[i];if(!tile||tile.dug)return;if(mine.activeDig){if(mine.activeDig.index===i)return;return notify('Finish digging the current rock first.');}const extra={stone:0,iron:550,coal:800,copper:950,tin:900,quartz:1050,silver:1250,gold:1450,amethyst:1550,lapis:1450,redstone:1750,topaz:1700,ruby:1900,sapphire:2050,obsidian:2400,diamond:2300,emerald:2550,moonstone:3100};const toolSpeed=mine.pickaxe==='deep'?.56:mine.pickaxe==='crystal'?.72:mine.pickaxe==='iron'?.86:1;const duration=Math.round((2400+(extra[tile.ore]||0))*(1+Math.min(24,Math.max(0,mine.depth-1))*.035)*toolSpeed);mine.activeDig={index:i,startedAt:Date.now(),endsAt:Date.now()+duration};saveActiveProfile();render();toast('You started digging…');}
function finishDigTile(){const mine=state.mining;if(!mine?.activeDig)return;const i=mine.activeDig.index;const tile=mine.grid[i];mine.activeDig=null;if(!tile||tile.dug){saveActiveProfile();render();return;}tile.dug=true;mine.inventory[tile.ore]=(mine.inventory[tile.ore]||0)+1;mine.dug++;const m=mineMaterials.find(x=>x.id===tile.ore);saveActiveProfile();render();toast(`Found ${m.emoji} ${m.name}!`)}
function descendMine(){ensureMine();const remaining=state.mining.grid.filter(t=>!t.dug).length;if(remaining>0)return notify(`You still have ${remaining} rocks left! Clear this level before descending.`);state.mining.depth++;generateMineGrid();saveActiveProfile();render();toast(`You reached cave level ${state.mining.depth}!`)}
function sellOre(id){ensureMine();const m=mineMaterials.find(x=>x.id===id);if(!m)return;const qty=state.mining.inventory[id]||0;if(!qty)return notify(`You don't have any ${m.name} to sell.`);state.mining.inventory[id]=0;state.mining.cashV2+=qty*m.price;saveActiveProfile();render();toast(`Sold ${qty} ${m.name} for ${fmt(qty*m.price)} Orbs!`)}
function sellAllOres(){ensureMine();let total=0,count=0;for(const m of mineMaterials){const q=state.mining.inventory[m.id]||0;total+=q*m.price;count+=q;state.mining.inventory[m.id]=0}if(!count)return notify('Your mining inventory is empty.');state.mining.cashV2+=total;saveActiveProfile();render();toast(`Sold ${count} materials for ${fmt(total)} Orbs!`)}
function addMinerLog(message){const a=state.mining.autoMiner;a.logs.unshift({message,time:Date.now()});a.logs=a.logs.slice(0,5)}
function craftMiningItem(id){ensureMine();const mine=state.mining;const recipes={ironPickaxe:{name:'Reinforced Iron Pickaxe',cost:90,needs:{iron:18,stone:24,coal:10},unlock:()=>mine.pickaxe==='starter'},crystalPickaxe:{name:'Crystal Pickaxe',cost:280,needs:{iron:12,gold:6,quartz:8,amethyst:3,diamond:1},unlock:()=>mine.pickaxe==='iron'},autoMiner:{name:'Auto-Miner',cost:180,needs:{stone:42,iron:20,coal:16,copper:8,quartz:4},unlock:()=>!mine.autoMiner.built},deepDrill:{name:'Deep-Core Drill',cost:520,needs:{iron:20,copper:16,tin:12,redstone:8,obsidian:4},unlock:()=>mine.pickaxe==='crystal'&&!mine.deepDrill}};const r=recipes[id];if(!r)return;if(!r.unlock())return notify(id==='autoMiner'?'You already built your one Auto-Miner.':'You already have this tool or need the previous pickaxe first.');if(mine.cashV2<r.cost)return notify(`You need ${r.cost} Orbs for ${r.name}.`);for(const [mat,q] of Object.entries(r.needs)){if((mine.inventory[mat]||0)<q)return notify(`You need ${q} ${mineMaterials.find(m=>m.id===mat).name}.`)}mine.cashV2-=r.cost;for(const [mat,q] of Object.entries(r.needs))mine.inventory[mat]-=q;if(id==='ironPickaxe')mine.pickaxe='iron';if(id==='crystalPickaxe')mine.pickaxe='crystal';if(id==='deepDrill'){mine.deepDrill=true;mine.pickaxe='deep';}if(id==='autoMiner'){mine.autoMiner={built:true,level:0,nextAt:Date.now()+45000,logs:[]};addMinerLog('Auto-Miner assembled. First collection in 45 seconds.')}saveActiveProfile();render();toast(`${r.name} crafted!`)}
function upgradeAutoMiner(){ensureMine();const a=state.mining.autoMiner;if(!a.built)return notify('Craft the Auto-Miner first.');if(a.level>=5)return notify('Auto-Miner is fully upgraded.');const cost=[120,240,420,700,1100][a.level];if(state.mining.cashV2<cost)return notify(`You need ${cost} Orbs for this upgrade.`);state.mining.cashV2-=cost;a.level++;a.nextAt=Math.min(a.nextAt||Date.now(),Date.now()+minerInterval());addMinerLog(`Upgraded to Auto-Miner level ${a.level}.`);saveActiveProfile();render();toast('Auto-Miner upgraded!')}
function minerInterval(){return Math.max(18000,45000-(state.mining.autoMiner?.level||0)*5000)}
function tickAutoMiner(){const mine=state.mining;if(!mine?.autoMiner?.built)return;const a=mine.autoMiner;if(!a.nextAt)a.nextAt=Date.now()+minerInterval();const left=Math.max(0,a.nextAt-Date.now()),countdown=document.getElementById('autoMinerCountdown'),progress=document.getElementById('autoMinerProgress');if(countdown)countdown.textContent=Math.ceil(left/1000);if(progress)progress.style.width=Math.max(0,Math.min(100,100-left/minerInterval()*100))+'%';if(Date.now()<a.nextAt)return;const capacity=100+(a.level*40);const total=mineMaterials.reduce((sum,m)=>sum+(mine.inventory[m.id]||0),0);if(total>=capacity){addMinerLog('Storage full — sell or use materials to resume mining.');a.nextAt=Date.now()+minerInterval();saveActiveProfile();if(state.tab==='mining'&&mine.view==='cave')render();return}let pool=mineMaterials.filter(m=>{if(['stone','iron','coal','copper','quartz'].includes(m.id))return true;if(a.level>=2&&['silver','gold','amethyst','topaz'].includes(m.id))return true;if(a.level>=3&&['ruby','sapphire'].includes(m.id))return true;if(a.level>=4&&m.id==='diamond')return true;if(a.level>=5&&m.id==='emerald')return true;return false});let weighted=pool.map(m=>({...m,weight:m.weight*(['diamond','emerald','ruby','sapphire'].includes(m.id)?0.65:1)}));let totalWeight=weighted.reduce((sum,m)=>sum+m.weight,0),roll=Math.random()*totalWeight,found=weighted[0];for(const m of weighted){roll-=m.weight;if(roll<=0){found=m;break}}mine.inventory[found.id]=(mine.inventory[found.id]||0)+1;addMinerLog(`Collected ${found.emoji} ${found.name} ×1`);a.nextAt=Date.now()+minerInterval();saveActiveProfile();if(state.tab==='mining'&&mine.view==='cave')render()}

function villageState(){if(!state.village)state.village={xp:0,houses:0,villagers:0,hunger:100,lastXpAt:Date.now()+180000,nextUpkeepAt:Date.now()+480000,produce:{},structures:{},upgrades:{xpGain:0,weather:0,pantry:0}};const v=state.village;v.produce=v.produce||{};v.structures=v.structures||{};v.upgrades={xpGain:0,weather:0,pantry:0,...(v.upgrades||{})};if(!Number.isFinite(v.hunger))v.hunger=100;if(!v.nextUpkeepAt)v.nextUpkeepAt=Date.now()+480000;if(!v.upkeepIntervalVersion){v.nextUpkeepAt=Date.now()+480000;v.upkeepIntervalVersion=2;}if(!v.lastXpAt)v.lastXpAt=Date.now()+180000;villageEnsurePlacements();return v}
const VILLAGE_TILE=64,VILLAGE_COLS=28,VILLAGE_ROWS=18;
function villageExpansionLevel(){return Math.max(0,Math.min(3,Number(villageState().upgrades.landExpansion)||0))}
function villageCols(){return VILLAGE_COLS+villageExpansionLevel()*8}
function villageRows(){return VILLAGE_ROWS+villageExpansionLevel()*6}
function villageWorldWidth(){return villageCols()*VILLAGE_TILE}
function villageWorldHeight(){return villageRows()*VILLAGE_TILE}
function villageBuiltCount(){return Object.values(villageState().structures||{}).reduce((sum,n)=>sum+(Number(n)||0),0)}
function villageRecipeScale(){return Math.min(2.5,1+Math.floor(villageBuiltCount()/2)*0.15)}
function villageScaledRecipe(r){const scale=villageRecipeScale();return {...r,ore:Object.fromEntries(Object.entries(r.ore).map(([id,n])=>[id,Math.ceil(n*scale)])),produce:Object.fromEntries(Object.entries(r.produce).map(([id,n])=>[id,Math.ceil(n*scale)])),xp:Math.ceil(r.xp*scale)}}
const villageFootprints={cottage:{w:2,h:2},storageShed:{w:2,h:2},weatherBeacon:{w:1,h:2},orchard:{w:3,h:2},mineOutpost:{w:2,h:2}};
const villageFixedBuildings=[{id:'__craftingYard',name:'Crafting Yard',emoji:'🛠️',x:320,y:160,w:3,h:2},{id:'__experienceExchange',name:'Experience Exchange',emoji:'✨',x:1088,y:160,w:3,h:2}];
function villageEnsurePlacements(){const v=state.village;if(!v)return;v.placements=Array.isArray(v.placements)?v.placements:[];v.pendingPlacement=v.pendingPlacement||null;const occupied=(x,y,w,h)=>[...villageFixedBuildings,...v.placements].some(b=>x<b.x+b.w*VILLAGE_TILE&&x+w*VILLAGE_TILE>b.x&&y<b.y+b.h*VILLAGE_TILE&&y+h*VILLAGE_TILE>b.y);const findSpot=(w,h)=>{for(let y=2;y<villageRows()-h-1;y++){for(let x=1;x<villageCols()-w-1;x++){if(!occupied(x*VILLAGE_TILE,y*VILLAGE_TILE,w,h))return{x:x*VILLAGE_TILE,y:y*VILLAGE_TILE,w,h}}}return null};for(const r of villageRecipes){const target=Math.max(0,Number(v.structures[r.id])||0),existing=v.placements.filter(p=>p.id===r.id).length;for(let i=existing;i<target;i++){const fp=villageFootprints[r.id]||{w:2,h:2},spot=findSpot(fp.w,fp.h);if(spot)v.placements.push({id:r.id,...spot});}}}
function villagePlacementOccupied(x,y,w,h){return [...villageFixedBuildings,...villageState().placements].some(b=>x<b.x+b.w*VILLAGE_TILE&&x+w*VILLAGE_TILE>b.x&&y<b.y+b.h*VILLAGE_TILE&&y+h*VILLAGE_TILE>b.y)}
function beginVillagePlacement(id){const r=villageRecipes.find(x=>x.id===id);if(!r)return;const v=villageState();if(v.pendingPlacement===id){v.pendingPlacement=null;render();return}if(!villageRecipeCanAfford(r))return notify('You need the listed materials, produce, and Village XP first.');v.pendingPlacement=id;render();toast(`Choose a clear spot for ${r.name}. Drag the plot to explore, then click an empty area.`)}
function cancelVillagePlacement(){const v=villageState();v.pendingPlacement=null;render()}
function placeVillageStructureAt(px,py){const v=villageState(),id=v.pendingPlacement,r=villageRecipes.find(x=>x.id===id);if(!r)return;const cost=villageScaledRecipe(r),fp=villageFootprints[id]||{w:2,h:2},x=Math.max(0,Math.min((villageCols()-fp.w)*VILLAGE_TILE,Math.floor(px/VILLAGE_TILE)*VILLAGE_TILE)),y=Math.max(0,Math.min((villageRows()-fp.h)*VILLAGE_TILE,Math.floor(py/VILLAGE_TILE)*VILLAGE_TILE));if(villagePlacementOccupied(x,y,fp.w,fp.h))return notify('That spot overlaps another building. Choose a clear patch of land.');if(!villageRecipeCanAfford(r)){v.pendingPlacement=null;render();return notify('Your supplies changed; you no longer have enough to build that.')}for(const [mat,n] of Object.entries(cost.ore))state.mining.inventory[mat]-=n;for(const [cropId,n] of Object.entries(cost.produce))v.produce[cropId]-=n;v.xp-=cost.xp;v.structures[id]=(v.structures[id]||0)+1;if(id==='cottage')v.houses++;if(id==='storageShed')v.upgrades.pantry=Math.min(5,(v.upgrades.pantry||0)+1);v.placements.push({id,x,y,w:fp.w,h:fp.h});v.pendingPlacement=null;saveActiveProfile();render();toast(`${r.emoji} ${r.name} placed successfully!`)}
function villageBuildingElement(b){const r=villageRecipes.find(x=>x.id===b.id)||{};const name=b.name||r.name||b.id,emoji=b.emoji||r.emoji||'🏡';return `<div class="village-world-building ${b.id}" data-building="${b.id}" style="left:${b.x}px;top:${b.y}px;width:${b.w*VILLAGE_TILE-8}px;height:${b.h*VILLAGE_TILE-8}px"><span class="building-icon">${emoji}</span><span class="building-name">${name}</span></div>`}
function attachVillageMapControls(){const viewport=document.getElementById('villageMapViewport'),world=document.getElementById('villageWorld');if(!viewport||!world)return;let down=null,dragged=false,ghost=document.getElementById('villagePlacementGhost');const getWorldPoint=e=>{const rect=world.getBoundingClientRect();return{x:e.clientX-rect.left,y:e.clientY-rect.top}};const updateGhost=e=>{if(!ghost)return;const p=getWorldPoint(e),id=villageState().pendingPlacement,r=villageRecipes.find(x=>x.id===id);if(!r){ghost.style.display='none';return}const fp=villageFootprints[id]||{w:2,h:2},x=Math.max(0,Math.min((villageCols()-fp.w)*VILLAGE_TILE,Math.floor(p.x/VILLAGE_TILE)*VILLAGE_TILE)),y=Math.max(0,Math.min((villageRows()-fp.h)*VILLAGE_TILE,Math.floor(p.y/VILLAGE_TILE)*VILLAGE_TILE));ghost.style.display='flex';ghost.style.left=x+'px';ghost.style.top=y+'px';ghost.style.width=(fp.w*VILLAGE_TILE-8)+'px';ghost.style.height=(fp.h*VILLAGE_TILE-8)+'px';ghost.classList.toggle('invalid',villagePlacementOccupied(x,y,fp.w,fp.h));ghost.innerHTML=`<span class="building-icon">${r.emoji}</span><small>${villagePlacementOccupied(x,y,fp.w,fp.h)?'Occupied':'Place here'}</small>`};viewport.addEventListener('pointerdown',e=>{if(e.button!==undefined&&e.button!==0)return;down={x:e.clientX,y:e.clientY,left:viewport.scrollLeft,top:viewport.scrollTop,worldX:e.clientX+viewport.scrollLeft,worldY:e.clientY+viewport.scrollTop};dragged=false;viewport.classList.add('is-dragging');viewport.setPointerCapture?.(e.pointerId);});viewport.addEventListener('pointermove',e=>{if(down){const dx=e.clientX-down.x,dy=e.clientY-down.y;if(Math.abs(dx)+Math.abs(dy)>4)dragged=true;if(dragged){viewport.scrollLeft=down.left-dx;viewport.scrollTop=down.top-dy;}}if(villageState().pendingPlacement)updateGhost(e)});viewport.addEventListener('pointerup',e=>{if(!down)return;const wasDrag=dragged;down=null;viewport.classList.remove('is-dragging');if(!wasDrag&&villageState().pendingPlacement){const p=getWorldPoint(e);placeVillageStructureAt(p.x,p.y)} });viewport.addEventListener('pointercancel',()=>{down=null;dragged=false;viewport.classList.remove('is-dragging')});viewport.addEventListener('pointerleave',()=>{if(!villageState().pendingPlacement&&ghost)ghost.style.display='none'});if(villageState().pendingPlacement){viewport.classList.add('placing');ghost.style.display='flex'}else{viewport.classList.remove('placing');if(ghost)ghost.style.display='none'}}
function recordVillageProduce(id,qty=1){const v=villageState();v.produce[id]=(v.produce[id]||0)+qty;}
function villageProduceTotal(){return Object.values(villageState().produce).reduce((a,n)=>a+(Number(n)||0),0)}
function villageProduceList(){return Object.entries(villageState().produce).filter(([id,n])=>n>0&&crop(id)).sort((a,b)=>crop(a[0]).world-crop(b[0]).world)}
function takeVillageProduce(id,qty){const v=villageState();if((v.produce[id]||0)<qty)return false;v.produce[id]-=qty;return true}
function villageRecipeCanAfford(r){const v=villageState(),inv=state.mining.inventory||{},cost=villageScaledRecipe(r);return Object.entries(cost.ore).every(([id,n])=>(inv[id]||0)>=n)&&Object.entries(cost.produce).every(([id,n])=>(v.produce[id]||0)>=n)&&v.xp>=cost.xp}
function craftVillageStructure(id){const r=villageRecipes.find(x=>x.id===id);if(!r)return;const v=villageState();if(!villageRecipeCanAfford(r))return notify('You need the listed mining materials, harvested farm produce, and Village XP.');for(const [mat,n] of Object.entries(r.ore))state.mining.inventory[mat]-=n;for(const [cropId,n] of Object.entries(r.produce))v.produce[cropId]-=n;v.xp-=r.xp;v.structures[id]=(v.structures[id]||0)+1;if(id==='cottage')v.houses++;if(id==='storageShed')v.upgrades.pantry=Math.min(5,(v.upgrades.pantry||0)+1);render();toast(`${r.emoji} ${r.name} built in your village!`)}
function inviteVillager(){const v=villageState();if(v.villagers>=v.houses*2+(v.upgrades.capacity||0)*2)return notify('Build another cottage or improve village capacity first.');const list=villageProduceList();if(villageProduceTotal()<5||state.mining.cashV2<60)return notify('Inviting a resident costs 5 harvested crops and 60 Orbs.');let left=5;for(const [id,n] of list){const take=Math.min(left,n);v.produce[id]-=take;left-=take;if(left<=0)break;}state.mining.cashV2-=60;if(v.villagers===0)v.lastXpAt=Date.now()+180000;v.villagers++;render();toast('A new resident moved into the village!')}
function renewVillage(){const v=villageState();const inv=state.mining.inventory;if((inv.stone||0)<12||villageProduceTotal()<5)return notify('Renewal needs 12 Stone and 5 harvested crops from your farm.');inv.stone-=12;let left=5;for(const [id,n] of villageProduceList()){const take=Math.min(left,n);v.produce[id]-=take;left-=take;if(left<=0)break;}v.hunger=Math.min(100,v.hunger+55);v.nextUpkeepAt=Date.now()+480000;render();toast('Village renewed! Residents are ready to keep working.')}
function buyVillageUpgrade(id){const v=villageState(),defs={xpGain:{name:'Resident Training',base:90,max:5,desc:'Residents generate more XP.'},weather:{name:'Weather Amplifier',base:140,max:5,desc:'Strengthens farming weather-event bonuses.'},capacity:{name:'Village Capacity',base:180,max:4,desc:'Adds room for two more residents.'},pantry:{name:'Pantry Management',base:110,max:5,desc:'Slows village hunger loss and upkeep.'}};const d=defs[id];if(!d)return;const level=v.upgrades[id]||0,cost=Math.floor(d.base*Math.pow(1.85,level));if(level>=d.max)return notify('That village upgrade is already maxed.');if(id==='weather'&&!(v.structures.weatherBeacon>0))return notify('Build a Weather Beacon before upgrading weather events.');if(v.xp<cost)return notify(`You need ${cost} Village XP for ${d.name}.`);v.xp-=cost;v.upgrades[id]=level+1;render();toast(`${d.name} upgraded to level ${level+1}!`)}
function tickVillage(){const v=villageState(),now=Date.now();if(v.villagers===0&&v.lastXpAt<now)v.lastXpAt=now+180000;if(now>=v.nextUpkeepAt){const interval=480000;const elapsed=Math.max(1,Math.floor((now-v.nextUpkeepAt)/interval)+1);v.nextUpkeepAt+=elapsed*interval;v.hunger=Math.max(0,v.hunger-elapsed*Math.max(4,12-(v.upgrades.pantry||0)*1.5));saveActiveProfile();}if(v.villagers>0&&v.hunger>0&&now>=v.lastXpAt){const periods=Math.max(1,Math.floor((now-v.lastXpAt)/180000)+1);const perPeriod=v.villagers*5*(1+(v.upgrades.xpGain||0)*.25)*(v.structures.orchard?1.1:1);v.xp+=Math.floor(periods*perPeriod);v.lastXpAt+=periods*180000;saveActiveProfile();}const hungerBar=document.getElementById('villageHungerBar');if(hungerBar)hungerBar.style.width=v.hunger+'%';const hungerText=document.getElementById('villageHungerText');if(hungerText)hungerText.textContent=Math.floor(v.hunger)+'%';const upkeep=document.getElementById('villageUpkeepTimer');if(upkeep)upkeep.textContent=Math.max(0,Math.ceil((v.nextUpkeepAt-now)/1000))+'s';const xp=document.getElementById('villageXPValue');if(xp)xp.textContent=fmt(v.xp);const villagers=document.getElementById('villageResidentCount');if(villagers)villagers.textContent=v.villagers;}
function buyVillageExpansion(){const v=villageState(),level=villageExpansionLevel();if(level>=3)return notify('Your village has reached its maximum expansion.');const costs=[{stone:60,iron:18,coal:12,orbs:300,xp:180},{stone:110,iron:36,coal:24,orbs:700,xp:420},{stone:180,iron:60,coal:40,orbs:1500,xp:850}][level];const inv=state.mining.inventory;if((inv.stone||0)<costs.stone||(inv.iron||0)<costs.iron||(inv.coal||0)<costs.coal||state.mining.cashV2<costs.orbs||v.xp<costs.xp)return notify(`Expansion ${level+1} needs ${costs.stone} Stone, ${costs.iron} Iron, ${costs.coal} Coal, ${costs.orbs} Orbs and ${costs.xp} XP.`);inv.stone-=costs.stone;inv.iron-=costs.iron;inv.coal-=costs.coal;state.mining.cashV2-=costs.orbs;v.xp-=costs.xp;v.upgrades.landExpansion=level+1;saveActiveProfile();render();toast(`Village expanded! New land unlocked: ${villageCols()} × ${villageRows()} tiles.`)}
function villageHTML(){const v=villageState(),totalProduce=villageProduceTotal(),residentsMax=v.houses*2+(v.upgrades.capacity||0)*2,inv=state.mining.inventory||{};const mineTotal=Object.values(inv).reduce((a,n)=>a+(Number(n)||0),0);const produceRows=villageProduceList().map(([id,n])=>{const c=crop(id);return `<span class="village-chip">${c.emoji} ${c.name} ×${fmt(n)}</span>`}).join('')||'<span class="muted small">Harvest crops to stock village supplies.</span>';const materialRows=mineMaterials.map(m=>`<span class="village-chip">${m.emoji} ${m.name} ×${fmt(inv[m.id]||0)}</span>`).join('');const recipeCards=villageRecipes.map(r=>{const cost=villageScaledRecipe(r);const needsOre=Object.entries(cost.ore).map(([id,n])=>{const m=mineMaterials.find(x=>x.id===id);return `<span class="recipe-chip ${(inv[id]||0)>=n?'have':'need'}">${m?.emoji||'🪨'} ${fmt(inv[id]||0)}/${n} ${m?.name||id}</span>`}).join('');const needsProduce=Object.entries(cost.produce).map(([id,n])=>{const c=crop(id);return `<span class="recipe-chip ${(v.produce[id]||0)>=n?'have':'need'}">${c?.emoji||'🌱'} ${fmt(v.produce[id]||0)}/${n} ${c?.name||id}</span>`}).join('');return card(`${r.emoji} ${r.name}`,`<p class="muted small">${r.desc}</p><div class="recipe-needs">${needsOre}${needsProduce}<span class="recipe-chip ${v.xp>=cost.xp?'have':'need'}">✨ ${fmt(v.xp)}/${cost.xp} XP</span></div><button class="btn primary" onclick="beginVillagePlacement('${r.id}')" ${villageRecipeCanAfford(r)?'':'disabled'}>${v.pendingPlacement===r.id?'Placement Active — Click Plot':'Craft & Place'}</button><p class="muted small">Built: ${v.structures[r.id]||0}</p>`)}).join('');const upgrades=[['xpGain','Resident Training',90,5,'Residents generate more XP.'],['weather','Weather Amplifier',140,5,'Strengthens farming weather-event bonuses.'],['capacity','Village Capacity',180,4,'Adds room for two more residents.'],['pantry','Pantry Management',110,5,'Slows village hunger loss and upkeep.']].map(([id,name,base,max,desc])=>{const level=v.upgrades[id]||0,cost=Math.floor(base*Math.pow(1.85,level)),blocked=id==='weather'&&!(v.structures.weatherBeacon>0);return card(`✨ ${name}`,`<p class="muted small">${desc}</p><div class="row"><span class="pill">Level ${level}/${max}</span><span class="price">${fmt(cost)} XP</span></div><button class="btn primary" onclick="buyVillageUpgrade('${id}')" ${level>=max||v.xp<cost||blocked?'disabled':''}>${blocked?'Requires Weather Beacon':level>=max?'Maxed':'Upgrade'}</button>`) }).join('');return hero('Village Plot 🏘️','Turn this empty plot into a living settlement. Farming supplies and mining materials work together here: harvested crops feed the village and ores build its structures.')+`<div class="village-topbar"><div class="village-meter"><div class="row"><b>🍲 Village Hunger</b><strong id="villageHungerText">${Math.floor(v.hunger)}%</strong></div><div class="progress"><span id="villageHungerBar" style="width:${v.hunger}%"></span></div><p class="muted small">When hunger reaches zero, residents stop earning XP.</p></div><div class="village-meter"><div class="row"><b>🔧 Renewal due</b><strong id="villageUpkeepTimer">${Math.max(0,Math.ceil((v.nextUpkeepAt-Date.now())/1000))}s</strong></div><p class="muted small">Renewal every 8 minutes. Costs 12 Stone + 5 harvested crops and restores 55 hunger.</p><button class="btn primary" onclick="renewVillage()">Renew Village</button></div><div class="village-meter"><div class="row"><b>✨ Village XP</b><strong id="villageXPValue">${fmt(v.xp)}</strong></div><p class="muted small">Residents produce XP every 3 minutes while the village is fed.</p><div class="big"><span id="villageResidentCount">${v.villagers}</span> / ${residentsMax} residents</div></div></div>
 <div class="village-expansion-card"><div><h3>🗺️ Village Land Expansion · ${villageExpansionLevel()}/3</h3><p>Unlock more buildable land. Each expansion adds 8 columns and 6 rows for new homes, gardens, and industry.</p><p><b>Next cost:</b> ${villageExpansionLevel()>=3?'MAX EXPANSION REACHED':`${[60,110,180][villageExpansionLevel()]} Stone · ${[18,36,60][villageExpansionLevel()]} Iron · ${[12,24,40][villageExpansionLevel()]} Coal · ${[300,700,1500][villageExpansionLevel()]} Orbs · ${[180,420,850][villageExpansionLevel()]} XP`}</p></div><button class="btn primary" onclick="buyVillageExpansion()" ${villageExpansionLevel()>=3?'disabled':''}>${villageExpansionLevel()>=3?'Village Fully Expanded':'Expand Village · Tier '+(villageExpansionLevel()+1)}</button></div><div class="village-map-viewport ${v.pendingPlacement?'placing':''}" id="villageMapViewport" aria-label="Top-down village plot. Hold and drag to pan; select a recipe then click a clear area to place it."><div class="village-map-hud"><span>🗺️ TOP-DOWN VILLAGE · DRAG TO PAN</span><span class="placement-hint">${v.pendingPlacement?`📍 Placing: ${villageRecipes.find(r=>r.id===v.pendingPlacement)?.name||'building'} · click a clear spot`:'Choose Craft & Place below to build'}</span></div><div class="village-world ${villageExpansionLevel()>0?'expanded':''}" id="villageWorld" style="width:${villageWorldWidth()}px;height:${villageWorldHeight()}px">${villageFixedBuildings.map(b=>villageBuildingElement({...b,id:'fixed'})).join('')}${v.placements.map(b=>villageBuildingElement(b)).join('')}<div class="village-placement-ghost" id="villagePlacementGhost" style="display:none"></div></div></div><div class="village-building-controls">${v.pendingPlacement?`<button class="btn danger" onclick="cancelVillagePlacement()">Cancel Placement</button><span class="muted small">Your resources are only spent after a valid placement. Buildings cannot overlap.</span>`:`<span class="muted small">Tip: hold the mouse button and drag anywhere on the map to pan around the village. Buildings snap to the grid and cannot overlap.</span>`}</div>
 <div class="grid village-summary">${card('🌾 Farm Supplies',`<p class="muted small">Harvested produce stock: ${totalProduce} units</p><div class="village-chip-list">${produceRows}</div>`)}${card('⛏️ Mining Materials',`<p class="muted small">Materials available: ${fmt(mineTotal)} units</p><div class="village-chip-list">${materialRows}</div>`)}</div>
 <h2 class="section-title" id="villageCraftingYard">🏗️ Crafting Yard · Buildings & Structures</h2><p class="muted small">Recipes use both mining inventory and harvested crops. Village XP is also required. As your settlement grows, later buildings cost more materials and XP.</p><div class="grid village-recipes">${recipeCards}</div>
 <h2 class="section-title">👨‍🌾 Residents</h2><div class="card"><div class="row"><div><h3>Invite a resident</h3><p class="muted small">Costs 5 harvested crops and 60 Orbs. Each resident needs a home and generates XP every few minutes.</p></div><span class="pill">Housing: ${v.villagers}/${residentsMax}</span></div><button class="btn primary" onclick="inviteVillager()" ${v.villagers>=residentsMax||totalProduce<5||state.mining.cashV2<60?'disabled':''}>Invite Resident · 60 Orbs + 5 crops</button></div>
 <h2 class="section-title" id="villageExperienceShop">✨ Experience Exchange · Village Shop</h2><p class="muted small">Spend Village XP on permanent improvements. Weather upgrades affect the farming side of Sprout Valley.</p><div class="grid village-upgrades">${upgrades}</div>`}

ructures.</li><li>Materials and XP are only consumed when a valid placement succeeds; placement can be cancelled.</li><li>Existing village structures are migrated to saved positions where possible.</li></ul>`)}${card('v2.8.0 — Astral Gardens & Village Expansion <span class="pill">PREVIOUS</span>',`<p class="muted small">October 24, 2026 · Major farming and settlement update</p><ul><li>Opened World 4: Astral Gardens with eight new cosmic crops and a $160,000 unlock goal.</li><li>Added a buildable Village Plot to the farm world, with a crafting yard and Experience Exchange.</li><li>Added a combined village supply system: harvested farm produce plus mining materials are used to craft buildings.</li><li>Added cottages, resident housing, Village XP earned over time, village hunger, and material-cost renewal.</li><li>Added XP upgrades for resident training, village capacity, pantry management, and farming weather-event boosts.</li><li>Kept progression deliberate with long crop growth times, expensive structures, and gradual resident XP.</li></ul>`)}${card('v2.7.1 — Mining Camera & Interface Fix <span class="pill">PREVIOUS</span>',`<p class="muted small">October 24, 2026 · Minor interface fix</p><ul><li>Mining now preserves the exact page camera position when starting or finishing a dig, including the horizontal mine-area scroll.</li><li>Removed the obsolete Mining Crafting Coming Soon banner from the farming Home screen; Space Exploration is the only remaining Coming Soon banner.</li><li>Updated the version labels and update log.</li></ul>`)}${card('v2.7.0 — Mining, Crafting & Auto-Mining <span class="pill">PREVIOUS</span>',`<p class="muted small">October 24, 2026 · Mining progression update</p><ul><li>Added copper, silver, quartz, amethyst, topaz, ruby, and sapphire to the mining materials pool.</li><li>Added craftable Reinforced Iron and Crystal Pickaxes with slower progression and improved speed/luck.</li><li>Added one animated Auto-Miner that collects materials into inventory, reports discoveries, and upgrades with Orbs.</li><li>Rebuilt the mine site as a horizontally scrolling district with a workshop, machine yard, and manual digging area.</li><li>Polished farming and mining screen surfaces while preserving local profiles and existing farming progress.</li></ul>`)}${card('v2.6.2 — Detailed Farm Buildings <span class="pill">PREVIOUS</span>',`<p class="muted small">October 24, 2026 · Farming world visual update</p><ul><li>Added extra glass reflections and framing to the Greenhouse.</li><li>Added timber grain, front trim, and a sturdier foundation to the Market.</li><li>Added luminous glass panels and a subtle glow to the Mutation Lab.</li><li>Added layered rock seams and crystal glints to the Mine Entrance.</li><li>Added small flower-and-shrub accents around buildings without overcrowding the valley.</li><li>Kept buildings clickable and preserved game mechanics and saves.</li></ul>`)}${card('v2.6.1 — Event-Matched Backgrounds <span class="pill">PREVIOUS</span>',`<p class="muted small">October 24, 2026 · Visual update</p><ul><li>Added unique background palettes for all 16 weather and seasonal events.</li><li>Event backgrounds update automatically when an event begins or ends.</li><li>Kept crop growth, event bonuses, purchases, and saves unchanged.</li></ul>`)}${card('v2.6.0 — Seed Expansion & Slower Progression <span class="pill">PREVIOUS</span>',`<p class="muted small">October 24, 2026 · Farming content and balance</p><ul><li>Added 26 new seeds across Sprout Meadow, Blossom Grove, and Crystal Highlands.</li><li>Added new garden vegetables, berries, flowers, tropical fruit, and rare cosmic crops.</li><li>Raised World 2 and World 3 unlock requirements for a longer journey.</li><li>Seed purchases cost a little more, crop growth takes longer, and basic harvest payouts are slightly lower.</li><li>Growth and economy upgrades still help speed up progress.</li></ul>`)}${card('v2.5.3 — Distinct Farm World Buildings & Interiors <span class="pill">PREVIOUS</span>',`<p class="muted small">October 24, 2026 · Building interior redesign</p><ul><li>Entering the Greenhouse now feels like stepping into a bright glass growing house.</li><li>The Market now has a warm timber-and-stone trading hall look.</li><li>The Mutation Lab has its own bright research-room look.</li><li>Mining screens sit inside a rocky underground mine atmosphere.</li><li>Planted crops change through five visible growth stages, from seed to harvest-ready plant.</li><li>Kept existing planting, harvesting, prices, saves, and mining logic.</li></ul>`)}${card('v2.5.0 — 2D Farm World',`<p class="muted small">October 24, 2026 · Farm interface redesign</p><ul><li>Rebuilt Home as a horizontally scrollable 2D valley with a sky, sun, grass, paths, and clickable buildings.</li><li>Moved farm plots and seed storage into the Greenhouse, seed buying and upgrades into the Market, and mutations into the Lab.</li><li>Made the cave entrance lead to the existing mining system and renamed its player-facing currency to Orbs.</li><li>Restyled the cave and turned the mining inventory into a material chest.</li><li>Kept the existing farming and mining mechanics and local profile save format.</li></ul>`)}${card('v2.4.2 — Timed Mining <span class="pill">PREVIOUS</span>',`<p class="muted small">October 23, 2026 · Mining pace and feedback</p><ul><li>Mining rocks now take a few seconds to break instead of yielding materials instantly.</li><li>Harder and rarer ores take longer to mine; deeper levels add a small time increase.</li><li>Only one rock can be mined at a time, with a live progress bar and countdown.</li><li>Materials are awarded only when the digging timer completes.</li></ul>`)}${card('v2.4.1 — Interface Fix <span class="pill">PREVIOUS</span>',`<p class="muted small">October 23, 2026 · Tab usability and home-screen update</p><ul><li>Made tab strips stay on one line and scroll horizontally when their buttons do not fit.</li><li>Improved the main navigation strip with clearer spacing and a visible scrollbar.</li><li>Added Space Update and Crafting in the Mines preview cards to the farming Home screen; both are marked Coming Soon.</li><li>Added a shortcut from the home-screen mine crafting preview to the mining workshop placeholder.</li></ul><h3>Previous update: v2.4.0 — Animated Interface</h3><ul><li>Added animated screen transitions, subtle ambient glow, and gently floating background details.</li><li>Added staggered card entrances, lively button feedback, and animated progress indicators.</li><li>Improved focus states and respects reduced-motion preferences.</li><li>Kept existing farming, mining, profile saves, and game balance intact.</li></ul><h3>Previous update: v2.3.1 — Visual Polish</h3><ul><li>Moved Mining off the main navigation and added a Mining entrance card to the farming Home screen.</li><li>Added a separate mining interface with Mining Home, Cave, Inventory, and Crafting tabs.</li><li>Added a return-to-farming button on Mining Home only; use Mining Home to return from the other mining tabs.</li><li>Expanded each cave level from 49 to 70 rocks (10 rows of 7).</li><li>Required every rock on a level to be dug before descending.</li><li>Added Stone, Iron, Coal, Gold, Diamond, and Emerald with a separate Orbs balance and selling system.</li><li>Improved rare material odds as cave depth increases.</li><li>Added a Crafting screen marked Coming Soon.</li><li>Preserved farming crops, worlds, seeds, upgrades, mutations, weather, achievements, daily rewards, profiles, and local saves.</li><li>Polished the interface with richer gradients, clearer focus states, softer card depth, animated hover feedback, and improved crop tiles.</li><li>Added lightweight illustrated meadow and world landscape panels built into the HTML, so no external image downloads are required.</li><li>Corrected Daily Rewards wording to match profile-based saving.</li></ul>`)}${card('v2.2.0 — Local Profiles & Saving',`<p class="muted small">October 23, 2026 · Pre-release</p><ul><li>Added separate garden profiles with nicknames.</li><li>Added automatic local saves after game actions and while playing.</li><li>Added profile switching, profile deletion, and reset-current-profile controls.</li><li>Saves stay in this browser and do not sync across devices.</li><li>No passwords or personal contact details are collected.</li></ul>`)}${card('v2.1.0 — Progression Balance Update',`<p class="muted small">October 23, 2026 · Pre-release</p><ul><li>Reduced crop selling values and tuned the economy for slower cash farming.</li><li>Raised seed prices to make bulk purchases a more meaningful decision.</li><li>Increased crop growing times, especially in later worlds.</li><li>Raised World 2 and World 3 unlock costs.</li><li>Increased upgrade costs to make each level feel like a milestone.</li><li>Kept weather events and mutations useful as temporary boosts.</li><li>Slower progression tuned for a more satisfying journey.</li></ul>`)}${card('v2.0.0 — Worlds & Weather',`<ul><li>Added Cash currency and Worlds 1–3.</li><li>Added World 4 Coming Soon.</li><li>Added 42 crops, bulk seed buying, and seed inventory.</li><li>Added mutations, upgrades, 16 weather events, achievements, and daily rewards.</li></ul>`)}${card('v1.2.0 — Farm Improvements',`<ul><li>Added update log and bulk seed buying.</li><li>Added inventory selection and planting.</li><li>Improved timer updates to reduce interface movement.</li></ul>`)}${card('v1.1.0 — Garden Update',`<ul><li>Expanded seed and crop shop.</li><li>Added upgrades and basic harvest feedback.</li></ul>`)}${card('v1.0.0 — First Sprout',`<ul><li>First playable farm prototype.</li><li>Plant, grow, and harvest crops.</li></ul>`)}</div>`}
function creditsHTML(){return hero('Credits 💚','A little garden built by a small team.')+`<div class="grid">${card('🌱 Jedi Romero','<p>Creator · Game concept and direction</p>')}${card('🧪 John','<p>Playtester · Testing and feedback</p>')}${card('🤖 ChatGPT','<p>Coding Assistant · Prototype code and balancing</p>')}</div>`}
function render(){
 // v2.7.1: preserve the player's camera position when interfaces re-render.
 const camera={x:window.scrollX,y:window.scrollY,scrollers:[]};
 document.querySelectorAll('.mine-expedition-wrap, .tabs, nav, .world-viewport').forEach((el)=>{
   const selector=el.matches('nav')?'nav':el.classList.contains('mine-expedition-wrap')?'.mine-expedition-wrap':el.classList.contains('world-viewport')?'.world-viewport':'.tabs';
   const index=[...document.querySelectorAll(selector)].indexOf(el);
   camera.scrollers.push({selector,index,left:el.scrollLeft,top:el.scrollTop});
 });
 nav();saveActiveProfile();$('profileBadge').textContent=activeProfile;$('cash').textContent=fmt(state.cash);let html={home:homeHTML,village:villageHTML,farm:farmHTML,seeds:seedsHTML,mining:miningHTML,market:marketHTML,upgrades:upgradesHTML,mutations:mutationsHTML,worlds:worldsHTML,events:eventsHTML,achievements:achievementsHTML,daily:dailyHTML,settings:settingsHTML,accounts:accountsHTML,versions:versionsHTML,credits:creditsHTML};const app=$('app');app.classList.remove('screen-enter');const screen=(html[state.tab]||homeHTML)();const rooms={farm:'greenhouse-room',seeds:'greenhouse-room',market:'market-room',upgrades:'market-room',mutations:'lab-room',mining:'mine-room'};app.innerHTML=rooms[state.tab]?`<section class="building-interior ${rooms[state.tab]}"><div class="interior-sign">${({ 'greenhouse-room':'🌿 GREENHOUSE · GROWING ROOM','market-room':'🧺 VALLEY MARKET · TRADING HALL','lab-room':'🧬 MUTATION LAB · RESEARCH WING','mine-room':'⛏️ DEEP MINES · UNDERGROUND'}[rooms[state.tab]])}</div><div class="interior-content">${screen}</div></section>`:screen;if(state.tab==='village')attachVillageMapControls();const eventClass=state.event?` event-${state.event.name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}`:'';document.body.className=`world-${state.world}${eventClass}`;camera.scrollers.forEach(saved=>{const list=document.querySelectorAll(saved.selector);const el=list[saved.index];if(el){el.scrollLeft=saved.left;el.scrollTop=saved.top;}});
 // Override the document's smooth-scroll styling for this restoration so it never drifts.

function tick(){let now=Date.now();tickAutoMiner();tickVillage();if(state.event&&now>=state.eventEnds){state.event=null;state.nextEvent=now+45000;if(state.tab==='events'||state.tab==='home')render()}else if(!state.event&&now>=state.nextEvent)beginEvent();document.querySelectorAll('.plot').forEach((el,i)=>{let p=state.plots[i];if(!p)return;let bar=el.querySelector('.progress span');if(bar)bar.style.width=Math.min(100,(now-p.started)/(p.ends-p.started)*100)+'%';let status=el.querySelector('.muted.small');if(status)status.textContent=isReady(p)?'Ready to harvest':`${Math.max(0,Math.ceil((p.ends-now)/1000))}s remaining`;let emoji=el.querySelector('.crop');if(emoji)emoji.textContent=isReady(p)?'✨':crop(p.crop).emoji;let btn=el.querySelector('button');if(btn&&btn.textContent.includes('Growing'))btn.textContent=isReady(p)?'Harvest':'Growing…'});let ev=document.querySelector('.event-active');if(ev&&state.event){let p=ev.querySelector('p');if(p)p.textContent=`${state.event.emoji} ${state.event.name} — ${state.event.desc} · ${Math.max(0,Math.ceil((state.eventEnds-now)/1000))}s left`}const active=state.mining?.activeDig;if(active){const duration=Math.max(1,active.endsAt-active.startedAt);const pct=Math.max(0,Math.min(100,(now-active.startedAt)/duration*100));const bar=document.getElementById('activeDigBar');if(bar)bar.style.width=pct+'%';const statusBar=document.getElementById('activeDigStatusBar');if(statusBar)statusBar.style.width=pct+'%';const countdown=document.getElementById('activeDigCountdown');if(countdown)countdown.textContent=Math.max(0,Math.ceil((active.endsAt-now)/1000))+'s';if(now>=active.endsAt)finishDigTile()}}
