@media(max-width:600px){nav{padding:9px 12px;gap:6px}nav button{padding:9px 11px;font-size:14px}.tabs{gap:6px}.tabs button{padding:8px 11px;font-size:14px}}.footer{text-align:center;color:var(--muted);font-size:13px;padding:20px}.world-2{background:radial-gradient(ellipse at top,#493b5c 0,#1b2029 65%,#0d1511 100%)}.world-3{background:radial-gradient(ellipse at top,#274d68 0,#1b2633 65%,#0d1511 100%)}.world-1{background:radial-gradient(ellipse at top,#274a36 0,#14251c 48%,#0d1511 100%)}input,select{background:#101c15;color:var(--cream);border:1px solid #4c6a51;border-radius:9px;padding:9px;font:inherit;max-width:100%}.tag{font-size:12px;border-radius:6px;background:#314a37;padding:3px 7px;color:#d4f0d2}.locked{opacity:.8;border-style:dashed}.event-active{border-color:#c9a85f;box-shadow:0 0 0 1px #c9a85f44}.mine-cave{padding:16px;border-radius:18px;border:1px solid #675c7a;background:radial-gradient(ellipse at top,#40364f,#211e2c 70%,#15151e);}.mine-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px;margin-top:14px}.mine-tile{aspect-ratio:1;border:1px solid #6b627a;border-radius:10px;background:linear-gradient(145deg,#51465f,#302a3b);color:#f7f0ff;font-size:clamp(19px,3vw,30px);cursor:pointer;box-shadow:inset 0 2px 5px #ffffff0b,0 3px 0 #15131c}.mine-tile:hover{filter:brightness(1.2)}.mine-tile.dug{background:#181720;border-color:#383441;box-shadow:none;cursor:default;opacity:.85}.mine-tile:disabled{opacity:.8}.mine-tile.mining-now{border-color:#ffe09a;box-shadow:0 0 0 2px #ffe09a33,0 0 18px #ffe09a22}.mine-tile .dig-progress{display:block;height:4px;background:#17131f;border-radius:99px;overflow:hidden;margin:5px 2px 0}.mine-tile .dig-progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,#9ed9a2,#ffe09a);transition:width .15s linear}.mine-status{margin-top:12px;padding:11px 13px;border:1px solid #8873a4;background:#2a2435;border-radius:12px}.ore-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.mine-wallet{background:#2d243c;border:1px solid #8873a4;color:#ead8ff;padding:12px 16px;border-radius:12px;font-weight:850}.crafting-locked{border:1px dashed #8873a4;background:#2a2435}.divider{height:1px;background:var(--line);margin:15px 0}.toast{position:fixed;right:16px;bottom:16px;z-index:10;background:#e3f1d9;color:#15231a;padding:12px 17px;border-radius:12px;font-weight:800;box-shadow:0 10px 30px #0006;display:none;max-width:90vw}/* v2.3.1 visual polish: richer depth, clearer focus, and illustrated world panels */
:root{--line:#45664f;--green:#b2efb4;--gold:#ffe09a}
body{background:radial-gradient(ellipse at 15% 0%,#315d43 0,transparent 38%),radial-gradient(ellipse at 90% 18%,#293f35 0,transparent 32%),linear-gradient(160deg,#14251c,#0b120e 82%);background-attachment:fixed}
header{backdrop-filter:blur(14px);box-shadow:0 8px 28px #0002}

.wallet,.mine-wallet{box-shadow:0 7px 22px #0002,inset 0 1px 0 #ffffff12}

nav button,.btn,.tabs button{transition:transform .16s ease,filter .16s ease,box-shadow .16s ease}

/* v2.4.0 — animated interface update */
:root{--ease-out:cubic-bezier(.16,1,.3,1);--glow-green:#a8f2b2;--glow-gold:#ffe3a1}
html{scroll-behavior:smooth}
body{isolation:isolate;overflow-x:hidden}
body:before,body:after{content:"";position:fixed;pointer-events:none;z-index:-1;border-radius:50%;filter:blur(2px);opacity:.28;animation:ambientDrift 18s ease-in-out infinite alternate}
body:before{width:34vw;height:34vw;min-width:220px;min-height:220px;left:-12vw;top:25vh;background:radial-gradient(circle,#68b97a40,transparent 68%)}
body:after{width:38vw;height:38vw;min-width:240px;min-height:240px;right:-15vw;top:55vh;background:radial-gradient(circle,#a8a0ff25,transparent 68%);animation-delay:-7s}
@keyframes ambientDrift{from{transform:translate3d(0,-12px,0) scale(.96)}to{transform:translate3d(20px,22px,0) scale(1.08)}}
header{position:relative;overflow:hidden}
header:after{content:"";position:absolute;left:-30%;top:0;width:28%;height:100%;background:linear-gradient(90deg,transparent,#ffffff08,transparent);transform:skewX(-20deg);animation:headerShimmer 11s ease-in-out infinite;pointer-events:none}
@keyframes headerShimmer{0%,65%{left:-35%}100%{left:120%}}
.logo{animation:logoFloat 4s ease-in-out infinite;transform-origin:50% 60%}
@keyframes logoFloat{0%,100%{translate:0 0;rotate:-3deg}50%{translate:0 -3px;rotate:2deg}}
.brand h1{background:linear-gradient(90deg,#f4f1df,#b7efbd,#f4f1df);background-size:200% auto;color:transparent;background-clip:text;animation:titleShimmer 9s linear infinite}
@keyframes titleShimmer{to{background-position:200% center}}
nav{scrollbar-width:thin;scrollbar-color:#52785b transparent}
nav button{position:relative;overflow:hidden}
nav button:after,.btn:after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 25%,#ffffff20 48%,transparent 70%);transform:translateX(-130%);transition:transform .5s var(--ease-out);pointer-events:none}
nav button:hover:after,.btn:hover:after{transform:translateX(130%)}
nav button.active{box-shadow:0 0 0 1px #b2efb433,0 0 18px #9ed9a21a}
#app{transform-origin:top center}
#app.screen-enter{animation:screenEnter .42s var(--ease-out) both}
@keyframes screenEnter{from{opacity:0;transform:translateY(11px) scale(.995);filter:blur(2px)}to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}
.hero{animation:heroEnter .55s var(--ease-out) both}
@keyframes heroEnter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.hero:before{content:"";position:absolute;right:-55px;bottom:-110px;width:230px;height:230px;border:1px solid #ffffff10;border-radius:50%;box-shadow:0 0 0 22px #ffffff04,0 0 0 44px #ffffff03;pointer-events:none}
.grid>.card{animation:cardEnter .48s var(--ease-out) both}
.grid>.card:nth-child(2){animation-delay:.045s}.grid>.card:nth-child(3){animation-delay:.09s}.grid>.card:nth-child(4){animation-delay:.135s}.grid>.card:nth-child(5){animation-delay:.18s}.grid>.card:nth-child(6){animation-delay:.225s}.grid>.card:nth-child(n+7){animation-delay:.26s}
@keyframes cardEnter{from{opacity:0;transform:translateY(12px) scale(.99)}to{opacity:1;transform:translateY(0) scale(1)}}
.card{position:relative;overflow:hidden}
.card:focus-within{border-color:#a5dba7}
.btn,nav button,.tabs button,.mine-tile{position:relative;overflow:hidden;transition:transform .18s var(--ease-out),filter .18s ease,box-shadow .18s ease,background .18s ease}
.btn:active,nav button:active,.tabs button:active{transform:scale(.97)}
.btn.primary{box-shadow:0 4px 0 #638a68,0 8px 18px #0002}
.btn.primary:hover{box-shadow:0 3px 0 #638a68,0 10px 24px #a8f2b222}
.plot{animation:plotPop .4s var(--ease-out) both}
@keyframes plotPop{from{opacity:.6;transform:scale(.97)}to{opacity:1;transform:scale(1)}}
.plot .crop{display:inline-block;animation:cropBob 3s ease-in-out infinite;transform-origin:50% 85%}
@keyframes cropBob{0%,100%{translate:0 0}50%{translate:0 -3px}}
.plot:has(button:not(:disabled):hover){border-color:#b4e7a7;box-shadow:0 0 0 1px #b4e7a733,0 12px 26px #0002}
.progress span{position:relative;overflow:hidden}
.progress span:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,#ffffff65,transparent);animation:progressShine 2.2s linear infinite}
@keyframes progressShine{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.scene-sun{animation:sunGlow 4s ease-in-out infinite}
@keyframes sunGlow{0%,100%{box-shadow:0 0 24px #fff0a855;transform:scale(1)}50%{box-shadow:0 0 40px #fff0a8aa;transform:scale(1.06)}}
.scene-flower{animation:flowerSway 4.5s ease-in-out infinite;transform-origin:50% 100%}
.scene-flower:nth-of-type(even){animation-delay:-1.8s}
@keyframes flowerSway{0%,100%{transform:rotate(-3deg) translateY(0)}50%{transform:rotate(3deg) translateY(-2px)}}
.world-art span{animation:worldFloat 3.5s ease-in-out infinite}
.world-art span:nth-child(2){animation-delay:-1.1s}.world-art span:nth-child(3){animation-delay:-2.2s}
@keyframes worldFloat{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-5px) rotate(2deg)}}
.mine-tile:not(.dug):hover{box-shadow:0 0 0 1px #c8b4f4,0 0 18px #b8a0ff25}
.mine-tile.dug{animation:rockCrack .22s ease-out}
@keyframes rockCrack{from{transform:scale(.9);filter:brightness(1.8)}to{transform:scale(1);filter:brightness(1)}}
.toast{animation:toastIn .3s var(--ease-out) both;border:1px solid #ffffff70}
@keyframes toastIn{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.section-title{position:relative}
.section-title:after{content:"";display:block;width:46px;height:3px;margin-top:6px;border-radius:99px;background:linear-gradient(90deg,var(--green),transparent)}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}


/* v2.5.0 — explorable 2D farm world and building interiors */

function createProfile(){const input=$('newProfileName');if(!input)return;const name=input.value.trim().replace(/\s+/g,' ').slice(0,24);if(!name)return notify('Enter a profile name first.');if(Object.keys(profiles).some(n=>n.toLowerCase()===name.toLowerCase()))return notify('That profile name already exists on this browser.');saveActiveProfile();activeProfile=name;state=defaultState();profiles[activeProfile]=JSON.parse(JSON.stringify(state));persistProfiles();render();toast('Garden profile created!');}

function toast(s){let t=$('toast');t.textContent=s;t.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.style.display='none',2300)}function notify(s){state.notice=s;toast(s)}function saveCash(n){state.cash+=n;state.stats.earned+=Math.max(0,n);$('cash').textContent=fmt(state.cash)}function seedCost(c){return Math.max(1,Math.ceil(c.cost*1.32*(1-lvl('supplier')*.025)*(1-lvl('seedling','mutations')*.025)*(state.event?.name==='Lucky Breeze' ? .85 : 1)))}function growTime(c){return Math.max(8,c.time*1.42*(1-lvl('soil')*.035)*(1-lvl('clock')*.04)*(1-lvl('rootnetwork','mutations')*.025)*(state.event?.type==='growth' ? .8 : 1))}function sellValue(c){let m=.62+lvl('premium')*.08+lvl('market')*.05+lvl('bountiful','mutations')*.06+lvl('premiumM','mutations')*.055+lvl('goldtouch','mutations')*.04+lvl('traveler','mutations')*.04;if(c.world===3)m+=lvl('cosmic','mutations')*.07;if(state.event&&['value','all'].includes(state.event.type))m*=state.event.mult;if(state.event?.type==='rare'&&c.world>=2)m*=state.event.mult;if(state.event?.type==='blossom'&&c.world===2)m*=state.event.mult;if(state.event?.type==='crystal'&&c.world===3)m*=state.event.mult;return Math.floor(c.value*m)}

function accountsHTML(){const names=Object.keys(profiles).sort((a,b)=>a.localeCompare(b));return hero('Accounts & Saves 👤','Create separate garden profiles on this browser. Each profile saves its own Cash, crops, upgrades, mutations, and world progress automatically.')+`<div class="grid">${card('🌱 Create a garden profile',`<p class="muted">Choose a nickname for this browser. Do not use your real full name, email, or password.</p><div class="row"><input id="newProfileName" maxlength="24" placeholder="Garden nickname" autocomplete="off"><button class="btn primary" onclick="createProfile()">Create profile</button></div>`)}${card('💾 Current profile',`<div class="big">${safeText(activeProfile)}</div><p class="muted">Your progress saves automatically in this browser.</p><span class="pill">${fmt(state.cash)} Cash · World ${state.world}</span><div class="divider"></div><button class="btn" onclick="resetCurrentSave()">Reset this profile</button>`)}${card('📂 Switch profiles',names.map(n=>`<div class="row"><span>${safeText(n)} ${n===activeProfile?'<span class="pill">ACTIVE</span>':''}</span><div class="row"><button class="btn ${n===activeProfile?'primary':''}" data-profile="${safeText(n)}" onclick="switchProfile(this.dataset.profile)" ${n===activeProfile?'disabled':''}>${n===activeProfile?'Selected':'Load'}</button>${names.length>1?`<button class="btn" data-profile="${safeText(n)}" onclick="deleteProfile(this.dataset.profile)">Delete</button>`:''}</div></div>`).join('<div class="divider"></div>'))}</div><div class="notice" style="margin-top:16px"><b>Important:</b> These are local profiles, not secure online accounts. They work on this browser and device only. Clearing browser data can erase them. For accounts that sync across devices, Sprout Valley needs a real online authentication/database service.</div>`}

const mineMaterials=[
 {id:'stone',name:'Stone',emoji:'🪨',price:2,weight:46,desc:'Common rock found throughout the cave.'},
 {id:'iron',name:'Iron',emoji:'⛓️',price:8,weight:27,desc:'Useful metal ore.'},
 {id:'coal',name:'Coal',emoji:'⚫',price:12,weight:17,desc:'A dark, valuable fuel mineral.'},
 {id:'gold',name:'Gold',emoji:'🟨',price:35,weight:7,desc:'A rare shiny find.'},
 {id:'diamond',name:'Diamond',emoji:'💎',price:100,weight:2.2,desc:'A precious gem, more likely deeper down.'},
 {id:'emerald',name:'Emerald',emoji:'🟢',price:150,weight:0.8,desc:'A very rare green gemstone.'}
];
function ensureMine(){if(!state.mining)state.mining={cashV2:0,depth:1,grid:[],inventory:{stone:0,iron:0,coal:0,gold:0,diamond:0,emerald:0},dug:0,view:'home'};state.mining.inventory=state.mining.inventory||{};mineMaterials.forEach(m=>{if(typeof state.mining.inventory[m.id]!=='number')state.mining.inventory[m.id]=0});if(!Array.isArray(state.mining.grid)||state.mining.grid.length!==70)generateMineGrid();}
function pickOre(){let depth=Math.max(1,state.mining.depth);let list=mineMaterials.map(m=>({...m,weight:m.weight*(m.id==='diamond'?1+depth*.22:m.id==='emerald'?1+depth*.28:m.id==='stone'?Math.max(.25,1-depth*.035):1)}));let total=list.reduce((a,m)=>a+m.weight,0),r=Math.random()*total;for(const m of list){r-=m.weight;if(r<=0)return m.id}return 'stone'}
function generateMineGrid(){ensureMineBase();state.mining.grid=Array.from({length:70},()=>({ore:pickOre(),dug:false}));}
function ensureMineBase(){if(!state.mining)state.mining={cashV2:0,depth:1,grid:[],inventory:{stone:0,iron:0,coal:0,gold:0,diamond:0,emerald:0},dug:0,view:'home'};state.mining.inventory=state.mining.inventory||{stone:0,iron:0,coal:0,gold:0,diamond:0,emerald:0};}
function digTile(i){ensureMine();const mine=state.mining;const tile=mine.grid[i];if(!tile||tile.dug)return;if(mine.activeDig){if(mine.activeDig.index===i)return;return notify('Finish digging the current rock first.');}const extra={stone:0,iron:450,coal:750,gold:1150,diamond:1650,emerald:2000};const duration=Math.round((1800+(extra[tile.ore]||0))*(1+Math.min(20,Math.max(0,mine.depth-1))*.025));mine.activeDig={index:i,startedAt:Date.now(),endsAt:Date.now()+duration};saveActiveProfile();render();toast('You started digging…');}
function finishDigTile(){const mine=state.mining;if(!mine?.activeDig)return;const i=mine.activeDig.index;const tile=mine.grid[i];mine.activeDig=null;if(!tile||tile.dug){saveActiveProfile();render();return;}tile.dug=true;mine.inventory[tile.ore]=(mine.inventory[tile.ore]||0)+1;mine.dug++;const m=mineMaterials.find(x=>x.id===tile.ore);saveActiveProfile();render();toast(`Found ${m.emoji} ${m.name}!`)}
function descendMine(){ensureMine();const remaining=state.mining.grid.filter(t=>!t.dug).length;if(remaining>0)return notify(`You still have ${remaining} rocks left! Clear this level before descending.`);state.mining.depth++;generateMineGrid();saveActiveProfile();render();toast(`You reached cave level ${state.mining.depth}!`)}
function sellOre(id){ensureMine();const m=mineMaterials.find(x=>x.id===id);if(!m)return;const qty=state.mining.inventory[id]||0;if(!qty)return notify(`You don't have any ${m.name} to sell.`);state.mining.inventory[id]=0;state.mining.cashV2+=qty*m.price;saveActiveProfile();render();toast(`Sold ${qty} ${m.name} for ${fmt(qty*m.price)} Orbs!`)}
function sellAllOres(){ensureMine();let total=0,count=0;for(const m of mineMaterials){const q=state.mining.inventory[m.id]||0;total+=q*m.price;count+=q;state.mining.inventory[m.id]=0}if(!count)return notify('Your mining inventory is empty.');state.mining.cashV2+=total;saveActiveProfile();render();toast(`Sold ${count} materials for ${fmt(total)} Orbs!`)}
function enterMining(){ensureMine();state.tab='mining';state.mining.view='home';render();window.scrollTo({top:0,behavior:'smooth'})}
function exitMining(){state.tab='home';render();window.scrollTo({top:0,behavior:'smooth'})}
function setMiningView(view){ensureMine();state.mining.view=view;saveActiveProfile();render()}
function miningHTML(){ensureMine();const mine=state.mining;const remaining=mine.grid.filter(t=>!t.dug).length;const totalItems=mineMaterials.reduce((sum,m)=>sum+(mine.inventory[m.id]||0),0);const miningNav=`<div class="tabs"><button class="${mine.view==='home'?'active':''}" onclick="setMiningView('home')">🏠 Mining Home</button><button class="${mine.view==='cave'?'active':''}" onclick="setMiningView('cave')">⛏️ Cave</button><button class="${mine.view==='inventory'?'active':''}" onclick="setMiningView('inventory')">🎒 Inventory</button><button class="${mine.view==='crafting'?'active':''}" onclick="setMiningView('crafting')">🛠️ Crafting</button></div>`;const miningHeader=`<div class="row"><div><span class="pill">MINING WORLD</span><h2 style="margin:8px 0">⛏️ The Deep Mines</h2><p class="muted">A separate adventure beneath Sprout Valley.</p></div><div class="mine-wallet">🪙 Orbs: ${fmt(mine.cashV2)}</div></div>`;
if(mine.view==='home')return hero('Welcome to the Deep Mines ⛏️','Mining has its own interface, progression, materials, and currency. Return to farming from this home screen.')+miningHeader+miningNav+`<div class="grid">${card('🪨 Your Progress',`<div class="big">Level ${mine.depth}</div><p class="muted">${70-remaining} of 70 rocks cleared on this level.</p><div class="progress"><span style="width:${((70-remaining)/70)*100}%"></span></div><button class="btn primary" onclick="setMiningView('cave')">Continue Digging</button>`)}${card('🎒 Your Materials',`<div class="big">${fmt(totalItems)} items</div><p class="muted">Materials collected and ready to sell.</p><button class="btn" onclick="setMiningView('inventory')">Open Inventory</button>`)}${card('🛠️ Workshop',`<div class="big">Coming Soon</div><p class="muted">Crafting tools and recipes will arrive in a future update.</p><button class="btn" onclick="setMiningView('crafting')">Visit Workshop</button>`)}</div><div class="card" style="margin-top:16px"><h3>🌱 Return to Sprout Valley</h3><p class="muted">You can return to the main game from Mining Home only. If you are in the Cave, Inventory, or Workshop, go back to Mining Home first.</p><button class="btn primary" onclick="exitMining()">Return to Farming Home</button></div>`;
if(mine.view==='cave')return hero('The Cave 🪨','Each rock takes time to break. Harder, rarer ores take longer, and you can work on one rock at a time. Clear all 70 rocks to descend.')+miningHeader+miningNav+`<div class="card"><div class="row"><div><h3>Level ${mine.depth}</h3><p class="muted">${remaining} rocks remaining.</p></div><button class="btn primary" onclick="descendMine()" ${remaining>0?'disabled':''}>Descend to Level ${mine.depth+1} ⬇️</button></div><div class="progress"><span style="width:${((70-remaining)/70)*100}%"></span></div><p class="small muted">Clear the whole level before moving deeper.</p></div><div class="mine-cave" style="margin-top:14px"><div class="row" style="position:relative;z-index:1;margin-bottom:8px"><span class="pill">🕯️ UNDERGROUND · LEVEL ${mine.depth}</span><span class="pill">⛏️ Click a rock to mine it</span></div><div class="mine-grid">${mine.grid.map((tile,i)=>{const active=mine.activeDig&&mine.activeDig.index===i;const busy=!!mine.activeDig&&!active;return `<button class="mine-tile ${tile.dug?'dug':''} ${active?'mining-now':''}" ${tile.dug||busy?'disabled':''} title="${tile.dug?'Already dug':active?'Currently digging':busy?'Finish the current rock first':'Start digging (takes a few seconds)'}" onclick="digTile(${i})">${tile.dug?'▫️':active?'⛏️':'🪨'}${active?`<span class="dig-progress"><span id="activeDigBar"></span></span>`:''}</button>`}).join('')}</div></div>${mine.activeDig?`<div class="mine-status"><div class="row"><b>⛏️ Breaking rock ${mine.activeDig.index+1}…</b><span id="activeDigCountdown">${Math.max(0,Math.ceil((mine.activeDig.endsAt-Date.now())/1000))}s</span></div><div class="progress"><span id="activeDigStatusBar" style="width:${Math.max(0,Math.min(100,(Date.now()-mine.activeDig.startedAt)/(mine.activeDig.endsAt-mine.activeDig.startedAt)*100))}%"></span></div><p class="small muted">Hang tight — the rock will break automatically.</p></div>`:''}<button class="btn" style="margin-top:14px" onclick="setMiningView('home')">Back to Mining Home</button>`;
if(mine.view==='inventory')return hero('Treasure Chest 🧰','Your mined materials are stored in this chest. Sell them for Orbs, separate from Farm Cash.')+miningHeader+miningNav+`<div class="card chest-inventory"><div class="row"><div><h3>Chest Contents</h3><p class="muted">${fmt(totalItems)} items collected</p></div><button class="btn primary" onclick="sellAllOres()" ${totalItems===0?'disabled':''}>Sell All Materials</button></div><div class="grid" style="margin-top:14px">${mineMaterials.map(m=>{const qty=mine.inventory[m.id]||0;return card(`${m.emoji} ${m.name}`,`<p class="muted small">${m.desc}</p><div class="row"><span>Owned: <b>${fmt(qty)}</b></span><span class="price">${fmt(m.price)} Orbs each</span></div><button class="btn" style="margin-top:10px" onclick="sellOre('${m.id}')" ${qty===0?'disabled':''}>Sell ${m.name}</button>`)}).join('')}</div></div><button class="btn" style="margin-top:14px" onclick="setMiningView('home')">Back to Mining Home</button>`;
return hero('Mining Workshop 🛠️','Crafting is planned for a future update. For now, gather and sell materials.')+miningHeader+miningNav+`<div class="card crafting-locked"><div style="padding:28px;text-align:center"><div style="font-size:54px">🛠️</div><div class="big">COMING SOON</div><p class="muted">Crafting tools, equipment, and recipes are not available yet. Your materials remain in your inventory.</p><button class="btn primary" onclick="setMiningView('inventory')">View Materials</button></div></div><button class="btn" style="margin-top:14px" onclick="setMiningView('home')">Back to Mining Home</button>`;
}
function versionsHTML(){return hero('Update Log 📋','What changed in each pre-release version.')+`<div class="grid">${card('v2.7.0 — Interface & Map Fixes <span class="pill">LATEST</span>',`<p class="muted small">October 24, 2026 · Interface and navigation update</p><ul><li>Made village buildings smaller and spaced farther apart.</li><li>Added click-and-drag scrolling to explore the village map.</li><li>Improved button feedback, keyboard focus outlines, and card styling.</li><li>Made the navigation tabs scroll horizontally on smaller screens.</li><li>Kept existing building destinations and game systems in place.</li></ul>`)}${card('v2.6.2 — Detailed Farm Buildings <span class="pill">PREVIOUS</span>',`<p class="muted small">October 24, 2026 · Farming world visual update</p><ul><li>Added extra glass reflections and framing to the Greenhouse.</li><li>Added timber grain, front trim, and a sturdier foundation to the Market.</li><li>Added luminous glass panels and a subtle glow to the Mutation Lab.</li><li>Added layered rock seams and crystal glints to the Mine Entrance.</li><li>Added small flower-and-shrub accents around buildings without overcrowding the valley.</li><li>Kept buildings clickable and preserved game mechanics and saves.</li></ul>`)}${card('v2.6.1 — Event-Matched Backgrounds <span class="pill">PREVIOUS</span>',`<p class="muted small">October 24, 2026 · Visual update</p><ul><li>Added unique background palettes for all 16 weather and seasonal events.</li><li>Event backgrounds update automatically when an event begins or ends.</li><li>Kept crop growth, event bonuses, purchases, and saves unchanged.</li></ul>`)}${card('v2.6.0 — Seed Expansion & Slower Progression <span class="pill">PREVIOUS</span>',`<p class="muted small">October 24, 2026 · Farming content and balance</p><ul><li>Added 26 new seeds across Sprout Meadow, Blossom Grove, and Crystal Highlands.</li><li>Added new garden vegetables, berries, flowers, tropical fruit, and rare cosmic crops.</li><li>Raised World 2 and World 3 unlock requirements for a longer journey.</li><li>Seed purchases cost a little more, crop growth takes longer, and basic harvest payouts are slightly lower.</li><li>Growth and economy upgrades still help speed up progress.</li></ul>`)}${card('v2.5.3 — Distinct Farm World Buildings & Interiors <span class="pill">LATEST</span>',`<p class="muted small">October 24, 2026 · Building interior redesign</p><ul><li>Entering the Greenhouse now feels like stepping into a bright glass growing house.</li><li>The Market now has a warm timber-and-stone trading hall look.</li><li>The Mutation Lab has its own bright research-room look.</li><li>Mining screens sit inside a rocky underground mine atmosphere.</li><li>Planted crops change through five visible growth stages, from seed to harvest-ready plant.</li><li>Kept existing planting, harvesting, prices, saves, and mining logic.</li></ul>`)}${card('v2.5.0 — 2D Farm World',`<p class="muted small">October 24, 2026 · Farm interface redesign</p><ul><li>Rebuilt Home as a horizontally scrollable 2D valley with a sky, sun, grass, paths, and clickable buildings.</li><li>Moved farm plots and seed storage into the Greenhouse, seed buying and upgrades into the Market, and mutations into the Lab.</li><li>Made the cave entrance lead to the existing mining system and renamed its player-facing currency to Orbs.</li><li>Restyled the cave and turned the mining inventory into a material chest.</li><li>Kept the existing farming and mining mechanics and local profile save format.</li></ul>`)}${card('v2.4.2 — Timed Mining <span class="pill">PREVIOUS</span>',`<p class="muted small">October 23, 2026 · Mining pace and feedback</p><ul><li>Mining rocks now take a few seconds to break instead of yielding materials instantly.</li><li>Harder and rarer ores take longer to mine; deeper levels add a small time increase.</li><li>Only one rock can be mined at a time, with a live progress bar and countdown.</li><li>Materials are awarded only when the digging timer completes.</li></ul>`)}${card('v2.4.1 — Interface Fix <span class="pill">PREVIOUS</span>',`<p class="muted small">October 23, 2026 · Tab usability and home-screen update</p><ul><li>Made tab strips stay on one line and scroll horizontally when their buttons do not fit.</li><li>Improved the main navigation strip with clearer spacing and a visible scrollbar.</li><li>Added Space Update and Crafting in the Mines preview cards to the farming Home screen; both are marked Coming Soon.</li><li>Added a shortcut from the home-screen mine crafting preview to the mining workshop placeholder.</li></ul><h3>Previous update: v2.4.0 — Animated Interface</h3><ul><li>Added animated screen transitions, subtle ambient glow, and gently floating background details.</li><li>Added staggered card entrances, lively button feedback, and animated progress indicators.</li><li>Improved focus states and respects reduced-motion preferences.</li><li>Kept existing farming, mining, profile saves, and game balance intact.</li></ul><h3>Previous update: v2.3.1 — Visual Polish</h3><ul><li>Moved Mining off the main navigation and added a Mining entrance card to the farming Home screen.</li><li>Added a separate mining interface with Mining Home, Cave, Inventory, and Crafting tabs.</li><li>Added a return-to-farming button on Mining Home only; use Mining Home to return from the other mining tabs.</li><li>Expanded each cave level from 49 to 70 rocks (10 rows of 7).</li><li>Required every rock on a level to be dug before descending.</li><li>Added Stone, Iron, Coal, Gold, Diamond, and Emerald with a separate Orbs balance and selling system.</li><li>Improved rare material odds as cave depth increases.</li><li>Added a Crafting screen marked Coming Soon.</li><li>Preserved farming crops, worlds, seeds, upgrades, mutations, weather, achievements, daily rewards, profiles, and local saves.</li><li>Polished the interface with richer gradients, clearer focus states, softer card depth, animated hover feedback, and improved crop tiles.</li><li>Added lightweight illustrated meadow and world landscape panels built into the HTML, so no external image downloads are required.</li><li>Corrected Daily Rewards wording to match profile-based saving.</li></ul>`)}${card('v2.2.0 — Local Profiles & Saving',`<p class="muted small">October 23, 2026 · Pre-release</p><ul><li>Added separate garden profiles with nicknames.</li><li>Added automatic local saves after game actions and while playing.</li><li>Added profile switching, profile deletion, and reset-current-profile controls.</li><li>Saves stay in this browser and do not sync across devices.</li><li>No passwords or personal contact details are collected.</li></ul>`)}${card('v2.1.0 — Progression Balance Update',`<p class="muted small">October 23, 2026 · Pre-release</p><ul><li>Reduced crop selling values and tuned the economy for slower cash farming.</li><li>Raised seed prices to make bulk purchases a more meaningful decision.</li><li>Increased crop growing times, especially in later worlds.</li><li>Raised World 2 and World 3 unlock costs.</li><li>Increased upgrade costs to make each level feel like a milestone.</li><li>Kept weather events and mutations useful as temporary boosts.</li><li>Slower progression tuned for a more satisfying journey.</li></ul>`)}${card('v2.0.0 — Worlds & Weather',`<ul><li>Added Cash currency and Worlds 1–3.</li><li>Added World 4 Coming Soon.</li><li>Added 42 crops, bulk seed buying, and seed inventory.</li><li>Added mutations, upgrades, 16 weather events, achievements, and daily rewards.</li></ul>`)}${card('v1.2.0 — Farm Improvements',`<ul><li>Added update log and bulk seed buying.</li><li>Added inventory selection and planting.</li><li>Improved timer updates to reduce interface movement.</li></ul>`)}${card('v1.1.0 — Garden Update',`<ul><li>Expanded seed and crop shop.</li><li>Added upgrades and basic harvest feedback.</li></ul>`)}${card('v1.0.0 — First Sprout',`<ul><li>First playable farm prototype.</li>< function attachWorldDrag(){
 const viewport=document.querySelector('.world-viewport');
 if(!viewport||viewport.dataset.dragReady==='1')return;
 viewport.dataset.dragReady='1';
 let start=null,moved=false;
 viewport.addEventListener('pointerdown',e=>{
  if(e.button!==undefined&&e.button!==0)return;
  if(e.target.closest('.world-building,button,a,input,select,textarea,label'))return;
  start={x:e.clientX,y:e.clientY,left:viewport.scrollLeft,id:e.pointerId};
  moved=false;
  viewport.classList.add('is-dragging');
  try{viewport.setPointerCapture(e.pointerId)}catch(_){}
 });
 viewport.addEventListener('pointermove',e=>{
  if(!start)return;
  const dx=e.clientX-start.x,dy=e.clientY-start.y;
  if(Math.abs(dx)>5||Math.abs(dy)>7)moved=true;
  if(moved){viewport.scrollLeft=start.left-dx;e.preventDefault()}
 });
 const finish=()=>{
  if(!start)return;
  const didMove=moved;start=null;moved=false;viewport.classList.remove('is-dragging');
  if(didMove){viewport.dataset.justDragged='1';setTimeout(()=>{delete viewport.dataset.justDragged},280)}
 };
 viewport.addEventListener('pointerup',finish);
 viewport.addEventListener('pointercancel',finish);
 viewport.addEventListener('lostpointercapture',finish);
 viewport.addEventListener('click',e=>{
  if(viewport.dataset.justDragged==='1'){e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();delete viewport.dataset.justDragged}
 },true);
}

function render(){nav();saveActiveProfile();$('profileBadge').textContent=activeProfile;$('cash').textContent=fmt(state.cash);let html={home:homeHTML,farm:farmHTML,seeds:seedsHTML,mining:miningHTML,market:marketHTML,upgrades:upgradesHTML,mutations:mutationsHTML,worlds:worldsHTML,events:eventsHTML,achievements:achievementsHTML,daily:dailyHTML,settings:settingsHTML,accounts:accountsHTML,versions:versionsHTML,credits:creditsHTML};const app=$('app');app.classList.remove('screen-enter');const screen=(html[state.tab]||homeHTML)();const rooms={farm:'greenhouse-room',seeds:'greenhouse-room',market:'market-room',upgrades:'market-room',mutations:'lab-room',mining:'mine-room'};app.innerHTML=rooms[state.tab]?`<section class="building-interior ${rooms[state.tab]}"><div class="interior-sign">${({ 'greenhouse-room':'🌿 GREENHOUSE · GROWING ROOM','market-room':'🧺 VALLEY MARKET · TRADING HALL','lab-room':'🧬 MUTATION LAB · RESEARCH WING','mine-room':'⛏️ DEEP MINES · UNDERGROUND'}[rooms[state.tab]])}</div><div class="interior-content">${screen}</div></section>`:screen;const eventClass=state.event?` event-${state.event.name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}`:'';document.body.className=`world-${state.world}${eventClass}`;void app.offsetWidth;app.classList.add('screen-enter');attachWorldDrag()}
function tick(){let now=Date.now();if(state.event&&now>=state.eventEnds){state.event=null;state.nextEvent=now+45000;if(state.tab==='events'||state.tab==='home')render()}else if(!state.event&&now>=state.nextEvent)beginEvent();document.querySelectorAll('.plot').forEach((el,i)=>{let p=state.plots[i];if(!p)return;let bar=el.querySelector('.progress span');if(bar)bar.style.width=Math.min(100,(now-p.started)/(p.ends-p.started)*100)+'%';let status=el.querySelector('.muted.small');if(status)status.textContent=isReady(p)?'Ready to harvest':`${Math.max(0,Math.ceil((p.ends-now)/1000))}s remaining`;let emoji=el.querySelector('.crop');if(emoji)emoji.textContent=isReady(p)?'✨':crop(p.crop).emoji;let btn=el.querySelector('button');if(btn&&btn.textContent.includes('Growing'))btn.textContent=isReady(p)?'Harvest':'Growing…'});let ev=document.querySelector('.event-active');if(ev&&state.event){let p=ev.querySelector('p');if(p)p.textContent=`${state.event.emoji} ${state.event.name} — ${state.event.desc} · ${Math.max(0,Math.ceil((state.eventEnds-now)/1000))}s left`}const active=state.mining?.activeDig;if(active){const duration=Math.max(1,active.endsAt-active.startedAt);const pct=Math.max(0,Math.min(100,(now-active.startedAt)/duration*100));const bar=document.getElementById('activeDigBar');if(bar)bar.style.width=pct+'%';const statusBar=document.getElementById('activeDigStatusBar');if(statusBar)statusBar.style.width=pct+'%';const countdown=document.getElementById('activeDigCountdown');if(countdown)countdown.textContent=Math.max(0,Math.ceil((active.endsAt-now)/1000))+'s';if(now>=active.endsAt)finishDigTile()}}
loadProfiles();render();setInterval(tick,500);setInterval(saveActiveProfile,5000);window.addEventListener('pagehide',saveActiveProfile);
</script></body></html>
